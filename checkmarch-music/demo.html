<title>Checkmarch Music Demo</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#f6f1e7; --panel:#fffaf0; --fg:#2b2620; --muted:#6f655a; --line:#e2d8c6;
  --btn:#efe5d3; --btn-fg:#2b2620; --accent:#3f6e8c; --accent-fg:#ffffff; --danger:#c0392b;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1b1f26; --panel:#232934; --fg:#e7e9ee; --muted:#9aa3b2; --line:#343c4a;
  --btn:#2d3542; --btn-fg:#e7e9ee; --accent:#7fb0d3; --accent-fg:#10151c; --danger:#e0645a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1b1f26; --panel:#232934; --fg:#e7e9ee; --muted:#9aa3b2; --line:#343c4a;
  --btn:#2d3542; --btn-fg:#e7e9ee; --accent:#7fb0d3; --accent-fg:#10151c; --danger:#e0645a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
main{max-width:560px;margin:0 auto}
h1{font-size:1.35rem;margin:8px 0 2px}
p{margin:0 0 12px;color:var(--muted)}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
button{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--btn);color:var(--btn-fg);
  font:inherit;padding:0 10px;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"].mood{background:var(--accent);color:var(--accent-fg);border-color:transparent}
#enable{width:100%;background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:600}
#enable[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg);border-color:var(--line)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid.two{grid-template-columns:repeat(2,1fr)}
.grid button.raid{color:var(--danger)}
.mood small{display:block;font-size:.72rem;color:inherit;opacity:.75;line-height:1.2;padding-bottom:4px}
.row{display:flex;align-items:center;gap:12px}
input[type=range]{flex:1;min-height:44px;accent-color:var(--accent);min-width:0}
.lbl{font-variant-numeric:tabular-nums;min-width:9ch;text-align:right}
.status{font-size:.85rem;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
</style>
<main>
  <h1>Checkmarch music</h1>
  <p>Every note is composed and synthesized live with Web Audio, from a seed. Tap Enable first; browsers only allow sound after a tap.</p>

  <section>
    <button id="enable" aria-pressed="false">Enable sound</button>
    <div class="status" id="status">Sound is off.</div>
  </section>

  <section>
    <h2>Moods (audio.setMood)</h2>
    <div class="grid two" id="moods"></div>
  </section>

  <section>
    <h2>Stings (audio.sting)</h2>
    <div class="grid" id="stings"></div>
  </section>

  <section>
    <h2>Legacy intensity (audio.setIntensity)</h2>
    <div class="row">
      <input id="intensity" type="range" min="0" max="3" step="1" value="0" aria-label="Intensity">
      <span class="lbl" id="level">0 · map</span>
    </div>
  </section>

  <section>
    <h2>One-shots (audio.play)</h2>
    <div class="grid" id="sfx"></div>
  </section>

  <section>
    <h2>Mix</h2>
    <div class="row"><span>Music</span><input id="bed" type="range" min="0" max="1" step="0.05" value="0.5" aria-label="Music volume"></div>
    <div class="row"><span>Effects</span><input id="fx" type="range" min="0" max="1" step="0.05" value="0.35" aria-label="Effects volume"></div>
  </section>
</main>

// setIntensity(n) is shorthand for setMood(MUSIC_INTENSITY_MOODS[n]).
const MUSIC_INTENSITY_MOODS = ['map', 'battle', 'danger', 'boss'];

// Small seeded PRNG (mulberry32). Returns floats in [0, 1).
function musicRng(seed) {
  let a = (Number(seed) >>> 0) || 0x9e3779b9;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Scale index (0 = root, 7 = root + octave) -> MIDI.
function musicDegMidi(root, mode, i) {
  const sc = MUSIC_MODES[mode];
  return root + 12 * Math.floor(i / 7) + sc[((i % 7) + 7) % 7];
}
// Nearest scale index for a MIDI note (ties go down).
function musicNearestIdx(root, mode, midi) {
  let best = 0, bd = Infinity;
  const base = Math.floor((midi - root) / 12) * 7;
  for (let i = base - 7; i <= base + 14; i++) {
    const d = Math.abs(musicDegMidi(root, mode, i) - midi);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
const MUSIC_NOTE_NAMES = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
function musicChordName(midis) {
  const [r, t, f] = midis, third = (t - r + 120) % 12, fifth = (f - r + 120) % 12;
  const q = third === 3 ? (fifth === 6 ? 'dim' : 'm') : third === 4 ? (fifth === 8 ? 'aug' : '') : '?';
  return MUSIC_NOTE_NAMES[r % 12] + q;
}

// Close-position voicing of the given pitch classes inside [lo, hi], with the smallest motion from prev.
function musicVoicing(notes, prev, lo = 52, hi = 72) {
  const pcs = [];
  for (const n of notes) { const pc = ((n % 12) + 12) % 12; if (!pcs.includes(pc)) pcs.push(pc); }
  pcs.sort((a, b) => a - b);
  const cands = [];
  for (let r = 0; r < pcs.length; r++) {
    for (let base = lo; base < lo + 12; base++) {
      if (((base % 12) + 12) % 12 !== pcs[r]) continue;
      const v = [base];
      for (let k = 1; k < pcs.length; k++) {
        const pc = pcs[(r + k) % pcs.length];
        let n = v[v.length - 1] + 1;
        while (((n % 12) + 12) % 12 !== pc) n++;
        v.push(n);
      }
      cands.push(v);
    }
  }
  const fit = cands.filter((v) => v[v.length - 1] <= hi);
  const pool = fit.length ? fit : cands;
  const mid = (lo + hi) / 2;
  let best = pool[0], bs = Infinity;
  for (const v of pool) {
    let s;
    if (prev && prev.length) s = v.reduce((a, n) => a + Math.min(...prev.map((p) => Math.abs(p - n))), 0);
    else s = Math.abs(v.reduce((a, n) => a + n, 0) / v.length - mid);
    s += (v[v.length - 1] - v[0]) * 0.05; // prefer compact
    if (s < bs) { bs = s; best = v; }
  }
  return best.slice();
}

// Maps a game situation to a mood name. All fields optional; the first matching rule wins.
//   runOver   the run just ended (run-over screen)            -> mourning
//   retired   the run ended by choice (abdicate)               -> triumph
//   battle    a battle is in progress                          -> boss | danger | battle
//   boss      ... and it is a citadel / keep fight             -> boss
//   check     ... and a king is in check                       -> danger
//   result    battle/raid/cache result card: 'win'|'loss'|'draw' -> triumph | mourning | (falls through)
//   threat    a raid or rival attack waits for orders on the map -> threat
//   forge     the forge (home) panel is open on the map        -> forge
//   otherwise                                                  -> map
function musicMoodFor(c) {
  c = c || {};
  if (c.runOver) return 'mourning';
  if (c.retired) return 'triumph';
  if (c.battle) return c.boss ? 'boss' : c.check ? 'danger' : 'battle';
  if (c.result === 'win') return 'triumph';
  if (c.result === 'loss') return 'mourning';
  if (c.threat) return 'threat';
  if (c.forge) return 'forge';
  return 'map';
}

// The composer: call nextBar(moodName) once per bar (8 eighth-note steps). Deterministic for a seed and
// a given sequence of mood names. Returns { mood, bpm, chordChange, chordBars, chord, section, events }
// where events are { step 0..7, voice, midi, vel 0..1, len (steps) }.
function createMusicComposer(seed) {
  const rnd = musicRng(seed);
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const rint = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  let moodName = null, m = null, bars = 0;
  let sec = null, secIx = -1, secLeft = 0, prog = null, chordPos = 0, barInChord = 0;
  let chord = null, voicing = null, lastMel = null;
  let motif = null, phraseBar = 0, restPhrase = false, breath = false, arpPat = null, drumPat = null, quiet = 0;
  let carry = [];

  function newSection(first) {
    let ix = Math.floor(rnd() * m.sections.length);
    if (!first && m.sections.length > 1 && ix === secIx) ix = (ix + 1 + Math.floor(rnd() * (m.sections.length - 1))) % m.sections.length;
    secIx = ix; sec = m.sections[ix]; prog = pick(sec.progs); chordPos = 0;
    secLeft = rint(m.sectionBars[0], m.sectionBars[1]);
    arpPat = m.arp ? pick(MUSIC_ARPS[m.arp.cells]) : null;
    drumPat = m.drum ? pick(m.drum.patterns) : null;
  }
  function makeChord() {
    const d = prog[chordPos % prog.length];
    const idx = [d, d + 2, d + 4];
    if (m.colorP && rnd() < m.colorP) idx.push(rnd() < 0.6 ? d + 1 : d + 6); // add9 or 7th
    const midis = idx.map((i) => musicDegMidi(sec.root, sec.mode, i));
    let bass = midis[0];
    while (bass >= 48) bass -= 12;
    while (bass < 36) bass += 12;
    let tonic = sec.root;
    while (tonic >= 45) tonic -= 12;
    while (tonic < 33) tonic += 12;
    voicing = musicVoicing(midis, voicing, 52, 71);
    chord = { degree: d, bass, tones: voicing.slice(), pcs: midis.map((n) => n % 12), tonic, name: musicChordName(midis) };
  }
  function enter(name) {
    moodName = name; m = MUSIC_MOODS[name]; bars = 0; phraseBar = 0; barInChord = 0; motif = null;
    newSection(true);
    makeChord();
    quiet = 0;
    if (m.sting) { carry = carry.concat(musicStingEvents(m.sting)); quiet = 2; }
  }
  // ---- melody ----
  const chordIdxNear = (i) => {
    let best = i, bd = Infinity;
    for (let k = i - 4; k <= i + 4; k++) {
      if (!chord.pcs.includes(musicDegMidi(sec.root, sec.mode, k) % 12)) continue;
      const d = Math.abs(k - i) + (k < i ? 0.1 : 0);
      if (d < bd) { bd = d; best = k; }
    }
    return best;
  };
  function makeMotif() {
    const rhythm = pick(MUSIC_CELLS[m.lute.cells]);
    const contour = rhythm.map((_, i) => (i === 0 ? 0 : pick([-2, -1, -1, 0, 1, 1, 2])));
    return { rhythm, contour, shift: 0 };
  }
  function vary(mo) {
    const op = pick(['repeat', 'invert', 'retro', 'rhythm', 'shift', 'shift']);
    if (op === 'invert') return { rhythm: mo.rhythm, contour: mo.contour.map((d) => -d), shift: mo.shift };
    if (op === 'retro') return { rhythm: mo.rhythm, contour: [0].concat(mo.contour.slice(1).reverse()), shift: mo.shift };
    if (op === 'rhythm') {
      const rhythm = pick(MUSIC_CELLS[m.lute.cells]);
      return { rhythm, contour: rhythm.map((_, i) => (i === 0 ? 0 : mo.contour[i] !== undefined ? mo.contour[i] : pick([-1, 1]))), shift: mo.shift };
    }
    if (op === 'shift') return { rhythm: mo.rhythm, contour: mo.contour, shift: pick([-2, -1, 1, 2]) };
    return { rhythm: mo.rhythm, contour: mo.contour, shift: mo.shift };
  }
  function melodyBar(mo, cadence, out) {
    const [lo, hi] = m.lute.range;
    const midiOf = (i) => musicDegMidi(sec.root, sec.mode, i);
    let cur = lastMel == null ? musicNearestIdx(sec.root, sec.mode, Math.round((lo + hi) / 2)) : musicNearestIdx(sec.root, sec.mode, lastMel);
    cur = chordIdxNear(cur + mo.shift);
    const rhythm = cadence ? pick(MUSIC_CADENCES) : mo.rhythm;
    rhythm.forEach(([step, len], n) => {
      let i = cur + (n === 0 ? 0 : (cadence ? pick([-1, 1, -1, 0]) : mo.contour[n] || 0));
      if (midiOf(i) > hi) i = cur - Math.abs(i - cur || 1);
      if (midiOf(i) < lo) i = cur + Math.abs(i - cur || 1);
      if ((step === 0 || step === 4) && len >= 2) i = chordIdxNear(i);
      if (cadence && n === rhythm.length - 1) i = chordIdxNear(i);
      while (midiOf(i) > hi) i -= 7;
      while (midiOf(i) < lo) i += 7;
      cur = i;
      if (n > 0 && rnd() > m.lute.density) return; // dropped note: breathing space inside the phrase
      const vel = step === 0 ? 0.9 : step === 4 ? 0.8 : 0.62 + rnd() * 0.15;
      out.push({ step, voice: 'lute', midi: midiOf(i), vel, len });

    });
  }
  function drumBar(pat, out) {
    for (let s = 0; s < 8; s++) {
      const ch = pat[s];
      const soft = m.drum.soft;
      if (ch === 'D') out.push({ step: s, voice: 'drum', midi: 0, vel: (s === 0 ? 1 : 0.8) * soft, len: 1 });
      else if (ch === 't') out.push({ step: s, voice: 'drum', midi: 1, vel: 0.6 * soft, len: 1 });
      else if (rnd() < m.drum.ghost) out.push({ step: s, voice: 'drum', midi: 1, vel: 0.3 * soft, len: 1 });
    }
  }

  function nextBar(name) {
    if (!MUSIC_MOODS[name]) name = 'map';
    let chordChange = false;
    if (name !== moodName) { enter(name); chordChange = true; }
    else if (barInChord >= m.barsPerChord) {
      barInChord = 0; chordPos++; chordChange = true;
      if (chordPos >= prog.length) {
        chordPos = 0;
        if (secLeft <= 0) newSection(false);
        else if (rnd() < 0.45) prog = pick(sec.progs); // slowly shifting progressions
      }
      makeChord();
    }
    const events = carry.filter((e) => e.step < 8);
    carry = carry.filter((e) => e.step >= 8).map((e) => Object.assign({}, e, { step: e.step - 8 }));

    if (phraseBar === 0) {
      restPhrase = rnd() < m.lute.rest;
      breath = rnd() < m.breath;
      motif = !motif || rnd() < m.lute.novelty ? makeMotif() : vary(motif);
    }
    const settled = m.settleBars && bars >= m.settleBars;
    const busy = quiet > 0;
    // melody: A, A', A'', cadence
    if (!busy && !restPhrase && !breath) melodyBar(phraseBar === 0 ? motif : vary(motif), phraseBar === 3, events);
    // lute accompaniment
    if (arpPat && !busy && !breath) {
      const p = m.arp.p * (settled ? 0.6 : 1);
      for (let s = 0; s < 8; s++) {
        const ti = arpPat[s];
        if (ti >= 0 && rnd() < p) events.push({ step: s, voice: 'arp', midi: voicing[ti % voicing.length], vel: s === 0 ? 0.7 : 0.55, len: 2 });
      }
    }
    if (m.bass) {
      for (const [s, kind, len] of m.bass.pattern) {
        if (s !== 0 && rnd() > m.bass.p) continue;
        const n = chord.bass + (kind === 1 ? 7 : kind === 2 ? 12 : 0);
        events.push({ step: s, voice: 'bass', midi: n, vel: s === 0 ? 1 : 0.7, len });
      }
    }
    if (m.drum && !breath && !(settled && phraseBar % 2 === 1)) {
      if (rnd() < 0.08 && phraseBar !== 3) drumPat = pick(m.drum.patterns);
      drumBar(phraseBar === 3 && rnd() < 0.5 ? m.drum.fill : drumPat, events);
    }
    if (m.bell && barInChord === 0 && rnd() < m.bell.p) {
      let n = pick(voicing);
      while (n < m.bell.range[0]) n += 12;
      while (n > m.bell.range[1]) n -= 12;
      events.push({ step: pick([0, 0, 2, 4]), voice: 'bell', midi: n, vel: 0.6 + rnd() * 0.3, len: 8 });
    }
    if (m.horn) {
      if (m.horn.kind === 'call' && phraseBar === 0 && !busy && rnd() < m.horn.p) {
        let t = sec.root; while (t > 59) t -= 12; while (t < 48) t += 12;
        events.push({ step: 0, voice: 'horn', midi: t, vel: 0.7, len: 3 }, { step: 3, voice: 'horn', midi: t + 7, vel: 0.75, len: 5 });
      } else if (m.horn.kind === 'chord' && chordChange && rnd() < m.horn.p) {
        const r = chord.bass + 12;
        events.push({ step: 0, voice: 'horn', midi: r, vel: 0.7, len: 6 }, { step: 0, voice: 'horn', midi: r + 7, vel: 0.6, len: 6 });
      }
    }
    if (m.heart) events.push({ step: 0, voice: 'heart', midi: 0, vel: 1, len: 1 });
    if (m.tick) for (let s = 0; s < 8; s++) events.push({ step: s, voice: 'tick', midi: 0, vel: s % 2 ? 0.6 : 1, len: 1 });

    events.sort((a, b) => a.step - b.step);
    const out = {
      mood: moodName, bpm: m.bpm, chordChange, chordBars: m.barsPerChord, chord, events,
      section: { root: sec.root, mode: sec.mode, index: secIx }, phraseBar, rest: restPhrase || breath || busy,
    };
    bars++; barInChord++; secLeft--; phraseBar = (phraseBar + 1) % 4; if (quiet > 0) quiet--;
    return out;
  }
  return { nextBar, get mood() { return moodName; } };
}

// A sting's events (same shape as composer events, steps may run to 15).
function musicStingEvents(name) {
  return (MUSIC_STINGS[name] || []).map(([step, voice, midi, len, vel]) => ({ step, voice, midi, len, vel }));
}

      const g = ctx.createGain(); env(g, t, 0.38 * vel, 0.004, 0.34);
      o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.45);
      noiseBurst(t, 0.04, dest, 0.08 * vel, 'lowpass', 700, 0.7);
    } else {
      noiseBurst(t, 0.05, dest, 0.14 * vel, 'bandpass', 1800, 1.4);
      tone('sine', 300, t, 0.08, dest, 0.07 * vel, 0.002);
    }
  }
  function heartbeat(t, vel) {
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(72, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.18);
    const g = ctx.createGain(); env(g, t, 0.35 * vel, 0.008, 0.22);
    o.connect(g); g.connect(nodes.layer.heart); o.start(t); o.stop(t + 0.3);
  }

  function playEvent(e, t) {
    const L = nodes.layer;
    switch (e.voice) {
      case 'lute': if (live('lute')) lute(t, e.midi, e.vel, e.len, L.lute, false); break;
      case 'arp': if (live('arp')) lute(t, e.midi, e.vel, e.len, L.arp, true); break;
      case 'bass': if (live('bass')) bassNote(t, e.midi, e.vel, e.len); break;
      case 'drum': if (live('drum')) handDrum(t, e.midi === 1, e.vel, L.drum); break;
      case 'bell': if (live('bell')) bell(t, e.midi, e.vel, L.bell); break;
      case 'horn': if (live('horn')) horn(t, e.midi, e.vel, e.len, L.horn); break;
      case 'heart': if (live('heart')) { heartbeat(t, 1); heartbeat(t + 0.24, 0.6); } break;
      case 'tick': if (live('tick')) noiseBurst(t, 0.02, L.tick, 0.08 * e.vel, 'highpass', 6500, 0.7); break;
    }
  }

  function scheduleStep(t) {
    if (barStep === 0) {
      bar = composer.nextBar(mood);
      STEP = 60 / bar.bpm / 2;
      byStep = [[], [], [], [], [], [], [], []];
      for (const e of bar.events) byStep[e.step].push(e);
      if (bar.chordChange) {
        if (live('pad')) padChord(t, bar.chord, bar.chordBars * STEPS_PER_BAR * STEP, MUSIC_MOODS[bar.mood].padAttack);
        for (const d of nodes.drone) d.o.frequency.setTargetAtTime(mtof(bar.chord.tonic + d.iv), t, 0.6);
      }
    }
    for (const e of byStep[barStep]) playEvent(e, t);
    barStep = (barStep + 1) % STEPS_PER_BAR;
  }

  function scheduleUntil(limit) {
    while (nextStepTime < limit) { scheduleStep(nextStepTime); nextStepTime += STEP; }
  }
  function tick() {
    try {
      if (!ctx || ctx.state !== 'running') return;
      const t = now();
      if (nextStepTime < t) nextStepTime = t + 0.05; // fell behind (throttled tab): resync
      scheduleUntil(t + LOOKAHEAD);
    } catch (e) { /* never throw from the scheduler */ }
  }
  function startLoop() {
    if (timer || !ctx || manual) return;
    nextStepTime = now() + 0.1;
    timer = setInterval(tick, TICK_MS);
    tick();
  }
  function stopLoop() { if (timer) { clearInterval(timer); timer = null; } }

  function fadeMaster(target, tc) {
    if (!nodes) return;
    const p = nodes.master.gain, t = now();
    p.cancelScheduledValues(t); p.setValueAtTime(p.value, t); p.setTargetAtTime(target, t, tc);
  }
  function duck(amount, hold) {
    const p = nodes.duck.gain, t = now();
    p.cancelScheduledValues(t); p.setValueAtTime(p.value, t);
    p.setTargetAtTime(amount, t, 0.05); p.setTargetAtTime(1, t + hold, 0.8);
  }

  // ---------- one-shots ----------
  const MIN_GAP = { move: 0.03, capture: 0.05, check: 0.3, promote: 0.3, win: 1.5, lose: 1.5, coin: 0.035, buy: 0.06, raid: 2.5 };
  const SFX = {
    move(t, out) {
      const r = 1 + (Math.random() * 0.1 - 0.05);
      noiseBurst(t, 0.035, out, 0.5, 'bandpass', 1900 * r, 3.5);
      tone('sine', 820 * r, t, 0.035, out, 0.22, 0.001);
      tone('triangle', 410 * r, t, 0.06, out, 0.1, 0.001);
    },
    capture(t, out) {
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(44, t + 0.2);
      const g = ctx.createGain(); env(g, t, 0.7, 0.004, 0.3);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.4);
      noiseBurst(t, 0.09, out, 0.35, 'lowpass', 420, 0.8);
      noiseBurst(t, 0.03, out, 0.25, 'bandpass', 1500, 2);
    },
    check(t, out) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2400; f.connect(out);
      for (const [m, dt, d] of [[76, 0, 0.16], [77, 0.17, 0.42]]) { // E5 -> F5: b2 over A minor
        tone('triangle', mtof(m), t + dt, d, f, 0.32, 0.008);
        tone('sine', mtof(m - 12), t + dt, d, f, 0.16, 0.008);
        tone('sawtooth', mtof(m), t + dt, d * 0.8, f, 0.04, 0.01, 8);
      }
    },
    promote(t, out) {
      [81, 88, 93].forEach((m, i) => {
        const tt = t + i * 0.07, f0 = mtof(m);
        for (const [ratio, pk, d] of [[1, 0.22, 1.3], [2.76, 0.07, 0.6], [5.4, 0.03, 0.3]]) tone('sine', f0 * ratio, tt, d, out, pk, 0.002);
      });
      sendBurstToVerb(t, 0.5);
    },
    win(t, out) {
      duck(0.45, 1.4);
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2600; f.connect(out);
      const seq = [69, 73, 76, 81]; // A major arpeggio (picardy lift from A minor)
      seq.forEach((m, i) => brass(t + i * 0.11, m, 0.1, f, 0.22));
      [73, 76, 81].forEach((m) => brass(t + 0.46, m, 0.9, f, 0.16));
      brass(t + 0.46, 57, 0.9, f, 0.14);
      sendBurstToVerb(t, 1.3);
    },
    lose(t, out) {
      duck(0.45, 1.6);
      const f = ctx.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.setValueAtTime(1800, t); f.frequency.exponentialRampToValueAtTime(350, t + 1.4); f.connect(out);
      [64, 62, 60, 57].forEach((m, i) => {
        const last = i === 3, tt = t + i * 0.22;
        const o = tone('triangle', mtof(m), tt, last ? 1.0 : 0.22, f, 0.3, 0.01);
        tone('sine', mtof(m - 12), tt, last ? 1.1 : 0.24, f, 0.2, 0.01);
        if (last) o.frequency.exponentialRampToValueAtTime(mtof(m) * 0.94, tt + 1.0);
      });
    },
    coin(t, out) {
      tone('sine', mtof(100), t, 0.1, out, 0.13, 0.002);
      tone('sine', mtof(107), t + 0.045, 0.16, out, 0.11, 0.002);
    },
    buy(t, out) {
      const o = ctx.createOscillator(); o.type = 'triangle';
      o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(95, t + 0.08);
      const g = ctx.createGain(); env(g, t, 0.45, 0.002, 0.14);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.2);
      noiseBurst(t, 0.05, out, 0.35, 'bandpass', 650, 1.5);
      noiseBurst(t + 0.045, 0.03, out, 0.2, 'bandpass', 2200, 3);
    },
    raid(t, out) {
      duck(0.55, 1.1);
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2800; f.connect(out);
      for (let i = 0; i < 6; i++) {
        const hi = i % 2 === 0, tt = t + i * 0.16;
        const o = tone('triangle', hi ? 880 : 660, tt, 0.14, f, 0.26, 0.01);
        o.frequency.linearRampToValueAtTime(hi ? 900 : 640, tt + 0.14);
        tone('sine', hi ? 440 : 330, tt, 0.14, f, 0.1, 0.01);
      }
    },
  };
  function brass(t, m, d, dest, pk) {
    tone('sawtooth', mtof(m), t, d, dest, pk * 0.35, 0.02, -5);
    tone('triangle', mtof(m), t, d, dest, pk, 0.015, 5);
  }
  // Route a short copy of the sfx bus into the reverb for a bit of space on bright cues.
  function sendBurstToVerb(t, hold) {
    const g = ctx.createGain(); g.gain.setValueAtTime(0.5, t); g.gain.setTargetAtTime(0, t + hold, 0.3);
    nodes.sfx.connect(g); g.connect(nodes.verb);
    setTimeout(() => { try { nodes.sfx.disconnect(g); } catch (e) { /* */ } }, (hold + 2) * 1000);
  }

  // ---------- visibility: pause when tab hidden (phone battery) ----------
  if (typeof document !== 'undefined' && document.addEventListener) {
    document.addEventListener('visibilitychange', () => {
      try {
        if (!ctx || manual) return;
        if (document.hidden) { stopLoop(); ctx.suspend(); }
        else if (enabled) { ctx.resume().then(startLoop, () => {}); }
      } catch (e) { /* */ }
    });
  }

  function setMoodInternal(name) {
    if (!MUSIC_MOODS[name]) return false;
    if (name === mood) return true;
    mood = name;
    try { applyMix(false); } catch (e) { /* */ }
    return true;
  }

  // ---------- public API ----------
  const api = {
    unlock() {
      try {
        if (failed) return false;
        if (!ctx && !build()) return false;
        if (ctx.state !== 'running' && !manual) ctx.resume().catch(() => {});
        // iOS: play a silent buffer inside the gesture
        const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, 22050); s.connect(ctx.destination); s.start(0);
        if (enabled) { fadeMaster(vol.master, 0.6); startLoop(); }
        return true;
      } catch (e) { failed = true; return false; }
    },
    setEnabled(on) {
      enabled = !!on;
      try {
        if (!ctx) return;
        if (enabled) {
          if (!manual) ctx.resume().catch(() => {});
          fadeMaster(vol.master, 0.4); startLoop();
        } else {
          fadeMaster(0, 0.12); stopLoop();
          if (!manual) setTimeout(() => { try { if (!enabled && ctx) ctx.suspend(); } catch (e) { /* */ } }, 600);
        }
      } catch (e) { /* */ }
    },
    // Backward-compatible: 0 map, 1 battle, 2 danger, 3 boss. Same as setMood(MUSIC_INTENSITY_MOODS[level]).
    setIntensity(level) {
      const l = Math.max(0, Math.min(3, Math.round(Number(level) || 0)));
      setMoodInternal(MUSIC_INTENSITY_MOODS[l]);
    },
    // Named moods (see MUSIC_MOODS). Unknown names are ignored and return false. Repeat calls are free.
    setMood(name) { return setMoodInternal(String(name)); },
    // Pure helper: game situation -> mood name (see musicMoodFor).
    moodFor(c) { return musicMoodFor(c); },
    // Play a mood's entry sting right now over whatever is playing: 'triumph' | 'mourning' | 'threat'.
    sting(name) {
      try {
        if (!ctx || !enabled || !MUSIC_STINGS[name]) return;
        if (ctx.state !== 'running' && !manual) return;
        const k = 'sting:' + name, t = now();
        if (lastPlay[k] !== undefined && t - lastPlay[k] < 4) return;
        lastPlay[k] = t;
        const t0 = Math.max(t + 0.05, nextStepTime - STEP);
        for (const e of musicStingEvents(name)) playEvent(e, t0 + e.step * STEP);
      } catch (e) { /* */ }
    },
    get moods() { return Object.keys(MUSIC_MOODS); },
    play(event) {
      try {
        if (!ctx || !enabled || !SFX[event]) return;
        if (ctx.state !== 'running' && !manual) { ctx.resume().catch(() => {}); return; }
        const t = now();
        if (lastPlay[event] !== undefined && t - lastPlay[event] < MIN_GAP[event]) return;
        lastPlay[event] = t;
        SFX[event](t + 0.01, nodes.sfx);
      } catch (e) { /* */ }
    },
    setVolume(v) {
      v = v || {};
      for (const k of ['master', 'bed', 'sfx']) if (typeof v[k] === 'number') vol[k] = Math.max(0, Math.min(1, v[k]));
      try {
        if (!nodes) return;
        const t = now();
        nodes.bed.gain.setTargetAtTime(vol.bed, t, 0.1);
        nodes.sfx.gain.setTargetAtTime(vol.sfx, t, 0.1);
        if (enabled) fadeMaster(vol.master, 0.1);
      } catch (e) { /* */ }
    },
    get state() {
      return {
        supported: !failed, unlocked: !!ctx, running: !!ctx && ctx.state === 'running', enabled,
        intensity: MUSIC_MOODS[mood].intensity, mood,
        chord: bar ? bar.chord.name : null, section: bar ? bar.section.mode : null,
      };
    },
    // Test hook: with opts.context (e.g. an OfflineAudioContext) nothing is scheduled automatically;
    // this schedules the bed up to context time `t` (seconds). Throws on scheduler errors (unlike tick()).
    _scheduleUntil(t) { if (nodes) { if (nextStepTime < now()) nextStepTime = now() + 0.05; scheduleUntil(t); } },
  };
  return api;
}

const audio = createAudio();
window.__music = { audio, createAudio, createMusicComposer, MUSIC_MOODS, musicMoodFor };
const $ = (id) => document.getElementById(id);
let on = false;
function ensureOn() { if (!on) { on = true; audio.unlock(); audio.setEnabled(true); } }
function refresh(){
  $('enable').textContent = on ? 'Mute sound' : 'Enable sound';
  $('enable').setAttribute('aria-pressed', String(on));
  const s = audio.state;
  $('status').textContent = !s.supported ? 'Web Audio is not available in this browser.'
    : on ? `Playing "${s.mood}" · ${s.section || '…'} · chord ${s.chord || '…'}` : 'Sound is off. Mood: ' + s.mood;
  for (const b of document.querySelectorAll('button.mood')) b.setAttribute('aria-pressed', String(b.dataset.mood === s.mood));
  $('intensity').value = String(s.intensity);
  $('level').textContent = s.intensity + ' · ' + MUSIC_INTENSITY_MOODS[s.intensity];
}
$('enable').addEventListener('click', () => {
  if (!on) ensureOn(); else { on = false; audio.setEnabled(false); }
  refresh();
});
for (const name of audio.moods) {
  const b = document.createElement('button');
  b.className = 'mood'; b.dataset.mood = name;
  b.innerHTML = name[0].toUpperCase() + name.slice(1) + '<small>' + MUSIC_MOODS[name].label.replace(/^[^(]*\(?/, '').replace(/\)$/, '') + '</small>';
  b.addEventListener('click', () => { ensureOn(); audio.setMood(name); refresh(); });
  $('moods').appendChild(b);
}
for (const name of Object.keys(MUSIC_STINGS)) {
  const b = document.createElement('button');
  b.textContent = name[0].toUpperCase() + name.slice(1);
  b.addEventListener('click', () => { ensureOn(); audio.sting(name); });
  $('stings').appendChild(b);
}
$('intensity').addEventListener('input', (e) => { ensureOn(); audio.setIntensity(Number(e.target.value)); refresh(); });
for (const ev of ['move','capture','check','promote','win','lose','coin','buy','raid']) {
  const b = document.createElement('button');
  b.textContent = ev[0].toUpperCase() + ev.slice(1);
  if (ev === 'raid') b.className = 'raid';
  b.addEventListener('click', () => { ensureOn(); refresh(); audio.play(ev); });
  $('sfx').appendChild(b);
}
$('bed').addEventListener('input', (e) => audio.setVolume({ bed: Number(e.target.value) }));
$('fx').addEventListener('input', (e) => audio.setVolume({ sfx: Number(e.target.value) }));
setInterval(refresh, 500);
refresh();
</script>
