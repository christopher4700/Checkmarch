<title>Checkmarch Map Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>

  --map-held-tint:rgba(63,125,90,0.16); --map-held-ring:#3f7d5a; --map-frontier:#b5832a;
  --map-fog:#d8c9a8; --map-fog-edge:#c4b28c; --map-ink:#3b2f22; --map-ink-soft:#7a6a55;

    --map-held-tint:rgba(108,196,149,0.14); --map-held-ring:#6cc495; --map-frontier:#e0b354;
    --map-fog:#353e4a; --map-fog-edge:#44505e; --map-ink:#e7ecf2; --map-ink-soft:#9aa6b5;

  --map-road:#6d7c8f; --map-road-held:#6cc495; --map-road-fog:rgba(130,145,165,0.30);
  --map-held-tint:rgba(108,196,149,0.14); --map-held-ring:#6cc495; --map-frontier:#e0b354;
  --map-fog:#353e4a; --map-fog-edge:#44505e; --map-ink:#e7ecf2; --map-ink-soft:#9aa6b5;
  --map-glyph:#101418; --map-badge-edge:rgba(0,0,0,0.45); --map-shadow:rgba(0,0,0,0.40);
  --map-danger:#ef6a5b; --map-keep:#6cc495; --map-garrison:#a998d0; --map-mine:#e1ad4e;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));

}
.wrap{max-width:560px; margin:0 auto}
header{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px}

}

  touch-action:manipulation;
}

.btnrow{display:flex; gap:8px; align-self:end}
.mapbox{border-radius:16px; overflow:hidden; background:var(--map-paper); border:1px solid var(--line)}
canvas#map{display:block; width:100%; touch-action:pan-y; cursor:pointer}
.hint{font-size:12px; color:var(--muted); margin:6px 2px 10px}
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:10px}

.stat b{display:block; font-size:18px; font-variant-numeric:tabular-nums}
.stat span{font-size:12px; color:var(--muted)}

.card h2{font-size:16px; margin:0 0 4px; display:flex; align-items:center; gap:8px}
.card p{margin:0; color:var(--muted); font-size:14px}

.tag.danger{color:var(--danger); border-color:var(--danger)}

.foot button{flex:1}

<div class="wrap">
  <header>
    <h1>Checkmarch<small>World map demo</small></h1>
    <button id="theme" type="button" aria-label="Toggle theme">Theme: auto</button>
  </header>

  <div class="controls">
    <label class="f">Seed<input id="seed" value="checkmarch" autocomplete="off" spellcheck="false"></label>
    <label class="f">Region<input id="region" type="number" min="1" max="99" value="1" inputmode="numeric"></label>
    <div class="btnrow">
      <button id="regen" class="primary" type="button">Generate</button>
      <button id="dice" type="button" aria-label="Random seed">Random</button>
    </div>
  </div>

  <div class="mapbox"><canvas id="map" aria-label="Region map"></canvas></div>
  <p class="hint">Tap a dashed node on the frontier to capture it. Drag sideways to pan.</p>

  <div class="stats">
    <div class="stat"><b id="sHeld">1</b><span>held</span></div>
    <div class="stat"><b id="sFront">0</b><span>frontier</span></div>
    <div class="stat"><b id="sNodes">0</b><span>nodes</span></div>
    <div class="stat"><b id="sTier">0</b><span>top tier</span></div>
  </div>

  <div class="card" id="info"><h2>Your keep</h2><p>Tap a node to inspect it.</p></div>

  <div class="legend" id="legend"></div>

  <div class="foot">
    <button id="reset" type="button">Reset fog</button>
    <button id="reveal" type="button">Capture all</button>
  </div>
</div>

<script>
// ---- inlined from map.mjs ----
// Checkmarch world map: region generation + territory/fog helpers.
// Pure ES module, no DOM, no dependencies. Deterministic from (seed, regionNumber).
// Inline-friendly: no imports; every top-level name is prefixed or map-specific.

const MAP_W = 1000;
const MAP_H = 600;
const TIERS_PER_REGION = 10;
const NODE_TYPES = ['keep', 'garrison', 'mine', 'town', 'shrine', 'citadel'];

// ---------- RNG ----------
function mapHashSeed(seed) {
  const s = String(seed);
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15;
  return h >>> 0;
}

function mapMulberry32(a) {
  a = a >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- geometry ----------
function mapOrient(ax, ay, bx, by, cx, cy) {
  const v = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
  return v > 1e-9 ? 1 : v < -1e-9 ? -1 : 0;
}
// Proper crossing of segments p1p2 and p3p4 (shared endpoints do not count).
function mapSegmentsCross(p1, p2, p3, p4) {
  if (p1 === p3 || p1 === p4 || p2 === p3 || p2 === p4) return false;
  const o1 = mapOrient(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y);
  const o2 = mapOrient(p1.x, p1.y, p2.x, p2.y, p4.x, p4.y);
  const o3 = mapOrient(p3.x, p3.y, p4.x, p4.y, p1.x, p1.y);
  const o4 = mapOrient(p3.x, p3.y, p4.x, p4.y, p2.x, p2.y);
  return o1 * o2 < 0 && o3 * o4 < 0;
}

// ---------- names ----------
const MAP_NAME_A = ['Ash', 'Bram', 'Cold', 'Dun', 'Elder', 'Fen', 'Gal', 'Hollow', 'Iron', 'Kes',
  'Lark', 'Mor', 'Nor', 'Oak', 'Pell', 'Raven', 'Salt', 'Thorn', 'Vale', 'Wolf', 'Yew', 'Gris',
  'Brack', 'Stone', 'Wyn', 'Har', 'Mire', 'Rook', 'Cinder', 'Glen', 'Hart', 'Quill'];
const MAP_NAME_B = ['ford', 'moor', 'wick', 'stead', 'holm', 'reach', 'gate', 'fell', 'mere',
  'by', 'ham', 'crest', 'dale', 'barrow', 'combe', 'ley', 'thorpe', 'hollow', 'field', 'ridge'];
const MAP_BOSS = ['the Ivory Regent', 'the Ashen Queen', 'the Pale Bishop', 'the Iron Castellan',
  'the Hollow King', 'the Twin Rooks', 'the Gray Marshal', 'the Night Knight', 'the Salt Tyrant',
  'the Thorn Duchess', 'the Last Vizier', 'the Black Abbot'];

function mapPick(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }

function mapMakeName(rng, type, used) {
  for (let tries = 0; tries < 40; tries++) {
    const stem = mapPick(rng, MAP_NAME_A) + mapPick(rng, MAP_NAME_B);
    let name;
    const v = rng();
    switch (type) {
      case 'keep': name = stem + ' Keep'; break;
      case 'garrison': name = v < 0.5 ? 'Fort ' + stem : stem + ' Garrison'; break;
      case 'mine': name = stem + (v < 0.5 ? ' Mine' : v < 0.8 ? ' Quarry' : ' Pits'); break;
      case 'town': name = v < 0.6 ? stem : stem + ' Market'; break;
      case 'shrine': name = v < 0.5 ? 'Shrine of ' + stem : stem + ' Chapel'; break;
      case 'citadel': name = 'Citadel of ' + stem; break;
      default: name = stem;
    }
    if (!used.has(name)) { used.add(name); return name; }
  }
  const fallback = type + ' ' + used.size;
  used.add(fallback);
  return fallback;
}

// ---------- generation ----------
const MAP_TYPE_WEIGHTS = {
  rich: [['garrison', 0.36], ['mine', 0.38], ['shrine', 0.16], ['town', 0.10]],
  mid: [['garrison', 0.55], ['mine', 0.18], ['town', 0.15], ['shrine', 0.12]],
  lean: [['garrison', 0.66], ['town', 0.20], ['mine', 0.09], ['shrine', 0.05]],
};

function mapWeighted(rng, table) {
  let r = rng();
  for (const [k, w] of table) { if ((r -= w) < 0) return k; }
  return table[table.length - 1][0];
}

/**
 * generateRegion(seed, regionNumber) -> region
 * region = { seed, regionNumber, width, height, keepId, citadelId, richBand,
 *            nodes: [{id,x,y,type,tier,name,col,band,dist,boss?}], roads: [[a,b], ...] (a<b) }
 */
function generateRegion(seed, regionNumber = 1) {
  regionNumber = Math.max(1, Math.floor(Number(regionNumber) || 1));
  const rng = mapMulberry32(mapHashSeed(String(seed) + '|region|' + regionNumber));
  const nameRng = mapMulberry32(mapHashSeed(String(seed) + '|names|' + regionNumber));

  const total = 20 + Math.floor(rng() * 11);           // 20..30 nodes incl. keep + citadel
  const middle = total - 2;
  const C = Math.max(Math.ceil(middle / 4), Math.min(8, Math.round(middle / 3.2)));
  // column sizes: 2..4, outer columns capped at 3
  const sizes = new Array(C).fill(2);
  let left = middle - 2 * C;
  let guard = 0;
  while (left > 0 && guard++ < 1000) {
    const k = Math.floor(rng() * C);
    const cap = (k === 0 || k === C - 1) ? 3 : 4;
    if (sizes[k] < cap) { sizes[k]++; left--; }
  }
  // (C chosen so capacity always suffices; guard is belt and braces)

  // ---- positions ----
  const nodes = [];
  const used = new Set();
  const X0 = 60, X1 = 940;
  nodes.push({ id: 0, x: X0 + Math.round((rng() - 0.5) * 30), y: 300 + Math.round((rng() - 0.5) * 80), col: -1 });
  const spacing = (X1 - X0) / (C + 1);
  const columns = [];
  for (let k = 0; k < C; k++) {
    const n = sizes[k];
    const slot = 470 / n;
    const col = [];
    for (let i = 0; i < n; i++) {
      const x = X0 + spacing * (k + 1) + (rng() - 0.5) * spacing * 0.36;
      const y = 65 + slot * (i + 0.5) + (rng() - 0.5) * slot * 0.45;
      const node = { id: nodes.length, x: Math.round(x), y: Math.round(y), col: k };
      nodes.push(node);
      col.push(node);
    }
    columns.push(col);
  }
  const citadel = { id: nodes.length, x: X1 + Math.round((rng() - 0.5) * 30), y: 300 + Math.round((rng() - 0.5) * 80), col: C };
  nodes.push(citadel);
  const keep = nodes[0];

  // ---- roads ----
  const roadSet = new Set();
  const roads = [];
  const addRoad = (a, b) => {
    const lo = Math.min(a, b), hi = Math.max(a, b);
    const key = lo * 1000 + hi;
    if (lo === hi || roadSet.has(key)) return false;
    roadSet.add(key);
    roads.push([lo, hi]);
    return true;
  };
  const removeRoad = (a, b) => {
    const lo = Math.min(a, b), hi = Math.max(a, b);
    roadSet.delete(lo * 1000 + hi);
    const i = roads.findIndex(r => r[0] === lo && r[1] === hi);
    if (i >= 0) roads.splice(i, 1);
  };
  const crossesAny = (a, b) => {
    for (const [c, d] of roads) {
      if (mapSegmentsCross(nodes[a], nodes[b], nodes[c], nodes[d])) return true;
    }
    return false;
  };

  for (const n of columns[0]) addRoad(keep.id, n.id);
  for (const n of columns[C - 1]) addRoad(citadel.id, n.id);

  const rightDeg = new Map(), leftDeg = new Map();
  for (let k = 0; k < C - 1; k++) {
    const L = columns[k], R = columns[k + 1];
    const gap = [];
    let i = 0, j = 0;
    gap.push([L[0], R[0]]);
    while (i < L.length - 1 || j < R.length - 1) {
      if (i === L.length - 1) j++;
      else if (j === R.length - 1) i++;
      else {
        const dy = L[i + 1].y - R[j + 1].y;
        if (Math.abs(dy) < 20) { if (rng() < 0.5) i++; else j++; }
        else if (dy < 0) i++; else j++;
      }
      gap.push([L[i], R[j]]);
    }
    for (const [a, b] of gap) {
      addRoad(a.id, b.id);
      rightDeg.set(a.id, (rightDeg.get(a.id) || 0) + 1);
      leftDeg.set(b.id, (leftDeg.get(b.id) || 0) + 1);
    }
    // prune interior staircase edges (first + last always survive => two disjoint
    // outer routes, north and south). R must keep a left edge (connectivity);
    // L may become a dead-end pocket rarely.
    const interior = gap.slice(1, -1);
    for (let t = interior.length - 1; t > 0; t--) {
      const s = Math.floor(rng() * (t + 1));
      [interior[t], interior[s]] = [interior[s], interior[t]];
    }
    for (const [a, b] of interior) {
      if (rng() > 0.8) continue;
      if ((leftDeg.get(b.id) || 0) <= 1) continue;
      if ((rightDeg.get(a.id) || 0) <= 1 && rng() > 0.25) continue;
      removeRoad(a.id, b.id);
      rightDeg.set(a.id, rightDeg.get(a.id) - 1);
      leftDeg.set(b.id, leftDeg.get(b.id) - 1);
    }
  }
  // a few north-south links inside a column (detours / cross-overs between routes)
  for (let k = 0; k < C; k++) {
    const col = columns[k];
    for (let i = 0; i + 1 < col.length; i++) {
      if (rng() < 0.12 && !crossesAny(col[i].id, col[i + 1].id)) addRoad(col[i].id, col[i + 1].id);
    }
  }
  roads.sort((p, q) => p[0] - q[0] || p[1] - q[1]);

  // ---- distances ----
  const adj = mapAdjacency(nodes.length, roads);
  const dist = mapBfs(adj, keep.id);

  // ---- bands, types ----
  const richBand = rng() < 0.5 ? 'north' : 'south';
  const bandOf = (y) => (y < 255 ? 'north' : y > 345 ? 'south' : 'mid');
  for (const n of nodes) {
    if (n === keep) { n.type = 'keep'; n.band = 'mid'; continue; }
    if (n === citadel) { n.type = 'citadel'; n.band = 'mid'; continue; }
    const geo = bandOf(n.y);
    n.band = geo === 'mid' ? 'mid' : (geo === richBand ? 'rich' : 'lean');
    n.type = mapWeighted(rng, MAP_TYPE_WEIGHTS[n.band]);
  }
  const mids = nodes.filter(n => n.type !== 'keep' && n.type !== 'citadel');
  // Column 0 is a gentle start: no shrines/towns adjacent to the keep, at least one garrison.
  for (const n of columns[0]) if (n.type === 'shrine') n.type = 'garrison';
  if (!columns[0].some(n => n.type === 'garrison')) columns[0][0].type = 'garrison';
  // Guarantees: >=2 mines, >=1 town, >=1 shrine, rich band clearly richer than lean band.
  const ensure = (type, count, prefer) => {
    let have = mids.filter(n => n.type === type).length;
    const pool = mids.filter(n => n.type === 'garrison' && n.col > 0)
      .sort((a, b) => (prefer(b) - prefer(a)) || (a.id - b.id));
    for (const n of pool) {
      if (have >= count) break;
      n.type = type; have++;
    }
  };
  const richFirst = (n) => (n.band === 'rich' ? 2 : n.band === 'mid' ? 1 : 0);
  const leanFirst = (n) => (n.band === 'lean' ? 2 : n.band === 'mid' ? 1 : 0);
  ensure('mine', 2, richFirst);
  ensure('shrine', 1, richFirst);
  ensure('town', 1, leanFirst);
  const econ = (band) => mids.filter(n => n.band === band && (n.type === 'mine' || n.type === 'shrine')).length;
  let fix = 0;
  while (econ('rich') < econ('lean') + 2 && fix++ < 20) {
    const leanMine = mids.find(n => n.band === 'lean' && (n.type === 'mine' || n.type === 'shrine'));
    const richGar = mids.find(n => n.band === 'rich' && n.type === 'garrison' && n.col > 0);
    if (leanMine && econ('lean') > 0 && mids.filter(n => n.type === 'mine').length > 2) { leanMine.type = 'garrison'; continue; }
    if (richGar) { richGar.type = 'mine'; continue; }
    break;
  }

  // ---- tiers ----
  const base = (regionNumber - 1) * TIERS_PER_REGION;
  let maxTier = base;
  for (const n of nodes) {
    n.dist = dist[n.id];
    if (n === keep) { n.tier = base; continue; }
    if (n === citadel) continue;
    n.tier = base + dist[n.id] + (n.band === 'rich' && n.col > 0 ? 1 : 0);
    if (n.tier > maxTier) maxTier = n.tier;
  }
  citadel.tier = Math.max(base + TIERS_PER_REGION, maxTier + 1);

  // ---- names ----
  for (const n of nodes) n.name = mapMakeName(nameRng, n.type, used);
  citadel.boss = mapPick(nameRng, MAP_BOSS);

  const outNodes = nodes.map(n => {
    const o = { id: n.id, x: n.x, y: n.y, type: n.type, tier: n.tier, name: n.name, col: n.col, band: n.band, dist: n.dist };
    if (n.boss) o.boss = n.boss;
    return o;
  });
  return {
    seed: String(seed), regionNumber, width: MAP_W, height: MAP_H,
    keepId: keep.id, citadelId: citadel.id, richBand,
    nodes: outNodes, roads,
  };
}

// ---------- graph helpers ----------
function mapAdjacency(nodeCount, roads) {
  const adj = Array.from({ length: nodeCount }, () => []);
  for (const [a, b] of roads) { adj[a].push(b); adj[b].push(a); }
  for (const l of adj) l.sort((p, q) => p - q);
  return adj;
}

function mapBfs(adj, from) {
  const d = new Array(adj.length).fill(Infinity);
  d[from] = 0;
  const q = [from];
  for (let h = 0; h < q.length; h++) {
    const u = q[h];
    for (const v of adj[u]) if (d[v] === Infinity) { d[v] = d[u] + 1; q.push(v); }
  }
  return d;
}

function neighbors(region, id) {
  const out = [];
  for (const [a, b] of region.roads) { if (a === id) out.push(b); else if (b === id) out.push(a); }
  return out.sort((p, q) => p - q);
}

function roadDistances(region, fromId = region.keepId) {
  return mapBfs(mapAdjacency(region.nodes.length, region.roads), fromId);
}

// ---------- territory / fog ----------
function mapHeldSet(held) {
  if (held instanceof Set) return held;
  return new Set(held || []);
}

/** Fresh map state for a region: only the keep is held. */
function initialMapState(region) {
  return { region, held: [region.keepId] };
}

/** frontier(state) -> sorted ids of unheld nodes adjacent (by road) to a held node. */
function frontier(state) {
  const held = mapHeldSet(state.held);
  const out = new Set();
  for (const [a, b] of state.region.roads) {
    if (held.has(a) && !held.has(b)) out.add(b);
    else if (held.has(b) && !held.has(a)) out.add(a);
  }
  return [...out].sort((p, q) => p - q);
}

/** visibility(state) -> array indexed by node id: 'held' | 'frontier' | 'fog'. */
function visibility(state) {
  const held = mapHeldSet(state.held);
  const vis = state.region.nodes.map(n => (held.has(n.id) ? 'held' : 'fog'));
  for (const id of frontier(state)) vis[id] = 'frontier';
  return vis;
}

/** canCapture(state, id): node is on the frontier (attackable). */
function canCapture(state, id) {
  return frontier(state).includes(id);
}

/** capture(state, id) -> new state with id held (immutable). Throws if not on the frontier. */
function capture(state, id) {
  if (!canCapture(state, id)) throw new Error('node ' + id + ' is not on the frontier');
  return { ...state, held: [...mapHeldSet(state.held), id].sort((p, q) => p - q) };
}

/**
 * fogView(state) -> what the player may know about each node.
 * held/frontier: full node + {vis}; fog: silhouette {id,x,y,vis:'fog',silhouette:true,big}
 * (big = true for the citadel, whose silhouette is always recognisable).
 */
function fogView(state) {
  const vis = visibility(state);
  return state.region.nodes.map(n => {
    if (vis[n.id] !== 'fog') return { ...n, vis: vis[n.id] };
    return { id: n.id, x: n.x, y: n.y, vis: 'fog', silhouette: true, big: n.type === 'citadel' };
  });
}

// ---- inlined from map-render.mjs ----
// Checkmarch world map: canvas 2D renderer + pan + tap hit-testing.
// Depends only on map.mjs (MAP_W, MAP_H, visibility). When inlining into one script,
// drop the import line below; both files then share one scope.

// Layout padding (layout units) around the 1000x600 region.
const MAP_PAD = 34;

// Palette keys. Pages should drive these from theme tokens (see mapPaletteFromCSS).
const MAP_PALETTE_KEYS = [
  'paper', 'paperEdge', 'paperMark', 'road', 'roadHeld', 'roadFog', 'heldTint', 'heldRing',
  'frontier', 'fog', 'fogEdge', 'ink', 'inkSoft', 'glyph', 'badgeEdge', 'shadow', 'danger',
  'keep', 'garrison', 'mine', 'town', 'shrine', 'citadel', 'labelBg',
];

const MAP_PALETTES = {
  light: {
    paper: '#f3e7cc', paperEdge: '#d9c59b', paperMark: 'rgba(120,90,40,0.13)',
    road: '#a88a5c', roadHeld: '#3f7d5a', roadFog: 'rgba(120,95,60,0.35)',
    heldTint: 'rgba(63,125,90,0.16)', heldRing: '#3f7d5a', frontier: '#b5832a',
    fog: '#d8c9a8', fogEdge: '#c4b28c', ink: '#3b2f22', inkSoft: '#7a6a55',
    glyph: '#fffaf0', badgeEdge: 'rgba(40,28,12,0.35)', shadow: 'rgba(60,40,10,0.22)',
    danger: '#c0392b', keep: '#3f7d5a', garrison: '#6b5b8a', mine: '#b07a1f',
    town: '#3d7aa6', shrine: '#2f9a94', citadel: '#9b2f2a', labelBg: 'rgba(255,250,238,0.94)',
  },
  dark: {
    paper: '#232a33', paperEdge: '#38424f', paperMark: 'rgba(170,190,215,0.08)',
    road: '#6d7c8f', roadHeld: '#6cc495', roadFog: 'rgba(130,145,165,0.30)',
    heldTint: 'rgba(108,196,149,0.14)', heldRing: '#6cc495', frontier: '#e0b354',
    fog: '#353e4a', fogEdge: '#44505e', ink: '#e7ecf2', inkSoft: '#9aa6b5',
    glyph: '#101418', badgeEdge: 'rgba(0,0,0,0.45)', shadow: 'rgba(0,0,0,0.40)',
    danger: '#ef6a5b', keep: '#6cc495', garrison: '#a998d0', mine: '#e1ad4e',
    town: '#74b2e0', shrine: '#5fcfc8', citadel: '#ef6a5b', labelBg: 'rgba(24,29,36,0.94)',
  },
};

/** Build a palette from CSS custom properties `--map-<kebab-key>` (falls back per key). */
function mapPaletteFromCSS(el, fallback = MAP_PALETTES.light) {
  const cs = getComputedStyle(el || document.documentElement);
  const out = {};
  for (const k of MAP_PALETTE_KEYS) {
    const v = cs.getPropertyValue('--map-' + k.replace(/[A-Z]/g, m => '-' + m.toLowerCase())).trim();
    out[k] = v || fallback[k];
  }
  return out;
}

// ---------- badges ----------
function mapGlyphPath(ctx, type, s) {
  // s = badge radius; draws a path centered at 0,0
  ctx.beginPath();
  switch (type) {
    case 'keep': { // tower with crenels
      const w = s * 0.5, top = -s * 0.42, bot = s * 0.5, m = w / 2.5;
      ctx.moveTo(-w, bot); ctx.lineTo(-w, top);
      ctx.lineTo(-w + m, top); ctx.lineTo(-w + m, top + m * 0.9);
      ctx.lineTo(-m / 2, top + m * 0.9); ctx.lineTo(-m / 2, top);
      ctx.lineTo(m / 2, top); ctx.lineTo(m / 2, top + m * 0.9);
      ctx.lineTo(w - m, top + m * 0.9); ctx.lineTo(w - m, top);
      ctx.lineTo(w, top); ctx.lineTo(w, bot); ctx.closePath();
      break;
    }
    case 'garrison': { // shield
      const w = s * 0.46;
      ctx.moveTo(-w, -s * 0.5); ctx.lineTo(w, -s * 0.5); ctx.lineTo(w, -s * 0.02);
      ctx.quadraticCurveTo(w, s * 0.42, 0, s * 0.6);
      ctx.quadraticCurveTo(-w, s * 0.42, -w, -s * 0.02); ctx.closePath();
      break;
    }
    case 'mine': { // gem
      ctx.moveTo(-s * 0.52, -s * 0.12); ctx.lineTo(-s * 0.26, -s * 0.44);
      ctx.lineTo(s * 0.26, -s * 0.44); ctx.lineTo(s * 0.52, -s * 0.12);
      ctx.lineTo(0, s * 0.54); ctx.closePath();
      break;
    }
    case 'town': { // house
      const w = s * 0.46;
      ctx.moveTo(-w, s * 0.48); ctx.lineTo(-w, -s * 0.06); ctx.lineTo(0, -s * 0.52);
      ctx.lineTo(w, -s * 0.06); ctx.lineTo(w, s * 0.48); ctx.closePath();
      break;
    }
    case 'shrine': { // four-point star
      const o = s * 0.6, i = s * 0.17;
      ctx.moveTo(0, -o); ctx.lineTo(i, -i); ctx.lineTo(o, 0); ctx.lineTo(i, i);
      ctx.lineTo(0, o); ctx.lineTo(-i, i); ctx.lineTo(-o, 0); ctx.lineTo(-i, -i); ctx.closePath();
      break;
    }
    case 'citadel': { // crown
      const w = s * 0.56, b = s * 0.4, t = -s * 0.42;
      ctx.moveTo(-w, b); ctx.lineTo(-w, t + s * 0.12); ctx.lineTo(-w * 0.5, -s * 0.02);
      ctx.lineTo(0, t); ctx.lineTo(w * 0.5, -s * 0.02); ctx.lineTo(w, t + s * 0.12);
      ctx.lineTo(w, b); ctx.closePath();
      break;
    }
  }
}

function mapGlyphDetail(ctx, type, s, fill) {
  // small cut-outs in badge color for legibility
  ctx.fillStyle = fill;
  if (type === 'keep') {
    ctx.beginPath();
    ctx.moveTo(-s * 0.14, s * 0.5); ctx.lineTo(-s * 0.14, s * 0.18);
    ctx.arc(0, s * 0.18, s * 0.14, Math.PI, 0); ctx.lineTo(s * 0.14, s * 0.5); ctx.closePath(); ctx.fill();
  } else if (type === 'town') {
    ctx.fillRect(-s * 0.11, s * 0.14, s * 0.22, s * 0.34);
  } else if (type === 'garrison') {
    ctx.fillRect(-s * 0.05, -s * 0.36, s * 0.1, s * 0.74);
  } else if (type === 'mine') {
    ctx.beginPath(); ctx.moveTo(-s * 0.52, -s * 0.12); ctx.lineTo(s * 0.52, -s * 0.12);
    ctx.lineWidth = Math.max(1, s * 0.08); ctx.strokeStyle = fill; ctx.stroke();
  } else if (type === 'citadel') {
    ctx.fillRect(-s * 0.56, s * 0.18, s * 1.12, s * 0.07);
  }
}

/**
 * drawBadge(ctx, type, cx, cy, r, palette, mode)
 * mode: 'full' (badge + glyph) | 'fog' (silhouette disc; citadel keeps a crown outline)
 * cx, cy, r in the ctx's current units (CSS px for the map view).
 */
function drawBadge(ctx, type, cx, cy, r, palette, mode = 'full') {
  ctx.save();
  ctx.translate(cx, cy);
  // soft drop shadow
  ctx.fillStyle = palette.shadow;
  ctx.beginPath(); ctx.arc(0, r * 0.14, r * 1.02, 0, Math.PI * 2); ctx.fill();
  if (mode === 'fog') {
    ctx.fillStyle = palette.fog;
    ctx.strokeStyle = palette.fogEdge;
    ctx.lineWidth = Math.max(1, r * 0.1);
    ctx.beginPath(); ctx.arc(0, 0, r * 0.86, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (type === 'citadel') {
      mapGlyphPath(ctx, 'citadel', r * 0.9);
      ctx.fillStyle = palette.fogEdge; ctx.fill();
    }
    ctx.restore();
    return;
  }
  const fill = palette[type] || palette.inkSoft;
  ctx.fillStyle = fill;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = palette.badgeEdge;
  ctx.lineWidth = Math.max(1, r * 0.08);
  ctx.stroke();
  mapGlyphPath(ctx, type, r);
  ctx.fillStyle = palette.glyph; ctx.fill();
  mapGlyphDetail(ctx, type, r, fill);
  ctx.restore();
}

// ---------- road geometry ----------
function mapRoadCurve(a, b) {
  // deterministic gentle bend, perpendicular to the segment
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  const h = ((a.id * 73856093) ^ (b.id * 19349663)) >>> 0;
  const bend = (((h % 1000) / 1000) - 0.5) * 0.22 * len;
  return { cx: mx + (-dy / len) * bend, cy: my + (dx / len) * bend };
}

function mapTerrainMarks(region) {
  // deterministic decorative marks (hills / tufts) from the region seed, avoiding nodes
  let a = 0;
  const s = region.seed + '|' + region.regionNumber;
  for (let i = 0; i < s.length; i++) a = (Math.imul(a, 31) + s.charCodeAt(i)) | 0;
  const rnd = () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const marks = [];
  for (let i = 0; i < 70 && marks.length < 34; i++) {
    const x = rnd() * MAP_W, y = 20 + rnd() * (MAP_H - 40);
    if (region.nodes.some(n => Math.hypot(n.x - x, n.y - y) < 55)) continue;
    marks.push({ x, y, k: rnd() < 0.55 ? 'hill' : 'tuft', s: 0.7 + rnd() * 0.6 });
  }
  return marks;
}

/**
 * drawMap(ctx, opts) — low-level, stateless draw in CSS px.
 * opts: { region, held (array|Set), selected (id|null), palette, scale, offsetX, offsetY,
 *         width, height (CSS px of the canvas), time (ms, for frontier pulse; 0 = static),
 *         marks (optional cached terrain marks) }
 */
function drawMap(ctx, o) {
  const { region, palette: P, scale, width, height } = o;
  const offX = o.offsetX || 0, offY = o.offsetY || 0;
  const vis = visibility({ region, held: o.held });
  const sx = (x) => offX + (x + MAP_PAD) * scale;
  const sy = (y) => offY + (y + MAP_PAD) * scale;
  const nodes = region.nodes;

  ctx.clearRect(0, 0, width, height);
  // paper
  const pw = (MAP_W + MAP_PAD * 2) * scale, ph = (MAP_H + MAP_PAD * 2) * scale;
  ctx.fillStyle = P.paper;
  mapRoundRect(ctx, offX + 1, offY + 1, pw - 2, ph - 2, 14);
  ctx.fill();
  ctx.strokeStyle = P.paperEdge; ctx.lineWidth = 2; ctx.stroke();

  // terrain marks
  ctx.strokeStyle = P.paperMark; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  for (const m of (o.marks || mapTerrainMarks(region))) {
    const x = sx(m.x), y = sy(m.y), w = 14 * m.s * Math.max(scale, 0.5) * 1.6;
    ctx.beginPath();
    if (m.k === 'hill') { ctx.moveTo(x - w, y); ctx.quadraticCurveTo(x, y - w * 0.9, x + w, y); }
    else { ctx.moveTo(x - w * 0.4, y); ctx.lineTo(x - w * 0.2, y - w * 0.45); ctx.moveTo(x, y); ctx.lineTo(x, y - w * 0.6); ctx.moveTo(x + w * 0.4, y); ctx.lineTo(x + w * 0.2, y - w * 0.45); }
    ctx.stroke();
  }

  // held territory tint (one path => union, uniform alpha)
  ctx.fillStyle = P.heldTint;
  ctx.beginPath();
  const tr = 68 * scale;
  for (const n of nodes) if (vis[n.id] === 'held') { ctx.moveTo(sx(n.x) + tr, sy(n.y)); ctx.arc(sx(n.x), sy(n.y), tr, 0, Math.PI * 2); }
  for (const [a, b] of region.roads) {
    if (vis[a] === 'held' && vis[b] === 'held') {
      // fill the corridor between held nodes so territory reads as one shape
      const A = nodes[a], B = nodes[b];
      const dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1;
      // corner order chosen so the winding matches ctx.arc (clockwise on screen):
      // with nonzero fill, same-direction subpaths union instead of punching holes.
      const nx = (dy / L) * 40, ny = (-dx / L) * 40;
      ctx.moveTo(sx(A.x + nx), sy(A.y + ny)); ctx.lineTo(sx(B.x + nx), sy(B.y + ny));
      ctx.lineTo(sx(B.x - nx), sy(B.y - ny)); ctx.lineTo(sx(A.x - nx), sy(A.y - ny)); ctx.closePath();
    }
  }
  ctx.fill('nonzero');

  // roads
  ctx.lineCap = 'round';
  for (const [a, b] of region.roads) {
    const A = nodes[a], B = nodes[b];
    const c = mapRoadCurve(A, B);
    const va = vis[a], vb = vis[b];
    ctx.beginPath();
    ctx.moveTo(sx(A.x), sy(A.y));
    ctx.quadraticCurveTo(sx(c.cx), sy(c.cy), sx(B.x), sy(B.y));
    if (va === 'held' && vb === 'held') { ctx.setLineDash([]); ctx.strokeStyle = P.roadHeld; ctx.lineWidth = 4; }
    else if (va === 'fog' || vb === 'fog') { ctx.setLineDash([3, 6]); ctx.strokeStyle = P.roadFog; ctx.lineWidth = 2; }
    else { ctx.setLineDash([]); ctx.strokeStyle = P.road; ctx.lineWidth = 2.5; }
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // nodes
  const t = o.time || 0;
  const pulse = t ? 0.5 + 0.5 * Math.sin(t / 380) : 0.35;
  for (const n of nodes) {
    const x = sx(n.x), y = sy(n.y);
    const r = mapBadgeRadius(n.type, vis[n.id]);
    if (vis[n.id] === 'fog') { drawBadge(ctx, n.type, x, y, r, P, 'fog'); continue; }
    if (vis[n.id] === 'frontier') {
      ctx.strokeStyle = n.type === 'citadel' ? P.danger : P.frontier;
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.arc(x, y, r + 4 + pulse * 3, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
    drawBadge(ctx, n.type, x, y, r, P, 'full');
    if (vis[n.id] === 'held') {
      ctx.strokeStyle = P.heldRing; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, r + 2.5, 0, Math.PI * 2); ctx.stroke();
    }
    // tier tag
    if (n.type !== 'keep') {
      const label = String(n.tier);
      ctx.font = '700 11px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      const tw = ctx.measureText(label).width + 8;
      const ty = y + r + 3;
      ctx.fillStyle = P.labelBg;
      mapRoundRect(ctx, x - tw / 2, ty, tw, 14, 7); ctx.fill();
      ctx.fillStyle = n.type === 'citadel' ? P.danger : P.ink;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, x, ty + 7.5);
    }
  }

  // selection + name label
  if (o.selected != null && nodes[o.selected]) {
    const n = nodes[o.selected];
    const x = sx(n.x), y = sy(n.y), r = mapBadgeRadius(n.type, vis[n.id]);
    ctx.strokeStyle = P.ink; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y, r + 7, 0, Math.PI * 2); ctx.stroke();
    const label = vis[n.id] === 'fog' ? (n.type === 'citadel' ? 'Citadel (unscouted)' : 'Unscouted') : n.name;
    ctx.font = '600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    const tw = ctx.measureText(label).width + 16;
    let lx = Math.min(Math.max(x - tw / 2, 4), width - tw - 4);
    let ly = y - r - 34;
    if (ly < 4) ly = y + r + 22;
    ctx.fillStyle = P.labelBg; ctx.strokeStyle = P.paperEdge; ctx.lineWidth = 1;
    mapRoundRect(ctx, lx, ly, tw, 24, 12); ctx.fill(); ctx.stroke();
    ctx.fillStyle = P.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, lx + tw / 2, ly + 12.5);
  }
}

function mapBadgeRadius(type, vis) {
  const base = type === 'citadel' ? 19 : type === 'keep' ? 17 : 14;
  return vis === 'fog' && type !== 'citadel' ? base * 0.8 : base;
}

function mapRoundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/**
 * createMapView(canvas, opts) — stateful view: sizing, DPR, drag-to-pan, tap.
 * opts: { palette, onTap(id|null, event), minScale = 0.5, animate = true }
 * The canvas width follows its CSS box (set width:100% in CSS); its CSS height is set here.
 */
function createMapView(canvas, opts = {}) {
  const ctx = canvas.getContext('2d');
  const view = {
    region: null, held: [], selected: null,
    palette: opts.palette || MAP_PALETTES.light,
    scale: 1, offsetX: 0, cssW: 0, cssH: 0, marks: null,
  };
  const minScale = opts.minScale ?? 0.5;
  let raf = 0, destroyed = false;
  const reduced = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let animate = opts.animate !== false && !reduced;

  function contentW() { return (MAP_W + MAP_PAD * 2) * view.scale; }
  function clampOffset() {
    const minOff = Math.min(0, view.cssW - contentW());
    view.offsetX = Math.max(minOff, Math.min(0, view.offsetX));
  }
  function resize() {
    const w = canvas.clientWidth || (canvas.parentElement && canvas.parentElement.clientWidth) || 360;
    view.cssW = w;
    view.scale = Math.max(w / (MAP_W + MAP_PAD * 2), minScale);
    view.cssH = Math.round((MAP_H + MAP_PAD * 2) * view.scale);
    canvas.style.height = view.cssH + 'px';
    const dpr = Math.min(3, (typeof devicePixelRatio === 'number' && devicePixelRatio) || 1);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(view.cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    clampOffset();
    draw();
  }
  function draw(time) {
    if (!view.region || destroyed) return;
    drawMap(ctx, {
      region: view.region, held: view.held, selected: view.selected, palette: view.palette,
      scale: view.scale, offsetX: view.offsetX, offsetY: 0, width: view.cssW, height: view.cssH,
      time: animate ? (time || performance.now()) : 0, marks: view.marks,
    });
  }
  function loop(t) {
    raf = 0;
    if (destroyed || !animate) return;
    draw(t);
    raf = requestAnimationFrame(loop);
  }
  function startLoop() { if (animate && !raf && !destroyed) raf = requestAnimationFrame(loop); }

  function toLayout(px, py) {
    return { x: (px - view.offsetX) / view.scale - MAP_PAD, y: py / view.scale - MAP_PAD };
  }
  /** nodeAt(px, py): px/py in CSS px relative to the canvas top-left. Returns id or null. */
  function nodeAt(px, py) {
    if (!view.region) return null;
    let best = null, bestD = Infinity;
    for (const n of view.region.nodes) {
      const dx = view.offsetX + (n.x + MAP_PAD) * view.scale - px;
      const dy = (n.y + MAP_PAD) * view.scale - py;
      const d = Math.hypot(dx, dy);
      if (d < bestD) { bestD = d; best = n.id; }
    }
    return bestD <= 24 ? best : null; // ~48px touch target
  }

  // pointer handling: drag pans horizontally, a short press without movement taps
  let down = null;
  function onDown(e) {
    down = { x: e.clientX, y: e.clientY, off: view.offsetX, moved: false, id: e.pointerId };
    try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
  }
  function onMove(e) {
    if (!down || e.pointerId !== down.id) return;
    const dx = e.clientX - down.x;
    if (!down.moved && Math.abs(dx) > 6) down.moved = true;
    if (down.moved) { view.offsetX = down.off + dx; clampOffset(); if (!animate) draw(); }
  }
  function onUp(e) {
    if (!down || e.pointerId !== down.id) return;
    const wasTap = !down.moved;
    down = null;
    if (wasTap && opts.onTap) {
      const r = canvas.getBoundingClientRect();
      opts.onTap(nodeAt(e.clientX - r.left, e.clientY - r.top), e);
    }
  }
  function onCancel() { down = null; }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onCancel);
  canvas.style.touchAction = 'pan-y';

  let ro = null;
  if (typeof ResizeObserver === 'function') {
    let lastW = -1;
    ro = new ResizeObserver(() => { if (canvas.clientWidth !== lastW) { lastW = canvas.clientWidth; resize(); } });
    ro.observe(canvas);
  }

  const api = {
    setRegion(region, held) {
      view.region = region; view.marks = mapTerrainMarks(region);
      view.held = held || [region.keepId]; view.selected = null; view.offsetX = 0;
      resize(); startLoop();
    },
    setHeld(held) { view.held = held; draw(); },
    setSelected(id) { view.selected = id; draw(); },
    setPalette(p) { view.palette = p; draw(); },
    setAnimate(on) { animate = !!on && !reduced; if (animate) startLoop(); else draw(); },
    centerOn(id) {
      const n = view.region && view.region.nodes[id];
      if (!n) return;
      view.offsetX = view.cssW / 2 - (n.x + MAP_PAD) * view.scale; clampOffset(); draw();
    },
    nodeAt, toLayout, resize, draw: () => draw(),
    get scale() { return view.scale; }, get offsetX() { return view.offsetX; },
    destroy() {
      destroyed = true; if (raf) cancelAnimationFrame(raf); if (ro) ro.disconnect();
      canvas.removeEventListener('pointerdown', onDown); canvas.removeEventListener('pointermove', onMove);
      canvas.removeEventListener('pointerup', onUp); canvas.removeEventListener('pointercancel', onCancel);
    },
  };
  return api;
}


(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const canvas = $('map');
  let region = null, state = null, selected = null;
  let palette = mapPaletteFromCSS(document.documentElement);

  const view = createMapView(canvas, { palette, onTap: tap });

  const TYPE_LABEL = { keep: 'Keep', garrison: 'Garrison', mine: 'Mine', town: 'Town', shrine: 'Shrine', citadel: 'Citadel' };
  const TYPE_NOTE = {
    keep: 'Your seat of power. Held from the start.',
    garrison: 'Enemy garrison. Clear it to advance.',
    mine: 'Hold it for gold per minute, all run long.',
    town: 'Market town: shop discount while held.',
    shrine: 'A shrine: a blessing for whoever holds it.',
    citadel: 'The region boss. Beat it to open the next region.',
  };

  function generate() {
    const seed = $('seed').value.trim() || 'checkmarch';
    const rn = Math.max(1, Math.min(99, parseInt($('region').value, 10) || 1));
    $('region').value = rn;
    region = generateRegion(seed, rn);
    state = initialMapState(region);
    selected = null;
    view.setRegion(region, state.held);
    refresh();
  }

  function refresh() {
    const f = frontier(state);
    $('sHeld').textContent = state.held.length;
    $('sFront').textContent = f.length;
    $('sNodes').textContent = region.nodes.length;
    const visible = fogView(state).filter(n => n.vis !== 'fog' && n.type !== 'keep');
    $('sTier').textContent = visible.length ? Math.max(...visible.map(n => n.tier)) : '-';
    view.setHeld(state.held);
    view.setSelected(selected);
    renderInfo();
  }

  function renderInfo() {
    const box = $('info');
    if (selected == null) {
      box.innerHTML = '<h2>' + esc(region.nodes[region.keepId].name) + '</h2><p>Region ' + region.regionNumber +
        ' &middot; the ' + (region.richBand === 'north' ? 'northern' : 'southern') +
        ' route is richer but better defended. Tap a node to inspect it.</p>';
      return;
    }
    const info = fogView(state)[selected];
    if (info.vis === 'fog') {
      box.innerHTML = '<h2>' + (info.big ? 'Citadel' : 'Unscouted') + ' <span class="tag">fog</span></h2>' +
        '<p>Capture a neighbouring node to scout it.</p>';
      return;
    }
    const tag = info.vis === 'held' ? '<span class="tag">held</span>' :
      '<span class="tag' + (info.type === 'citadel' ? ' danger' : '') + '">frontier &middot; tier ' + info.tier + '</span>';
    const boss = info.boss ? ' Ruled by ' + esc(info.boss) + '.' : '';
    box.innerHTML = '<h2>' + esc(info.name) + ' ' + tag + '</h2><p>' + TYPE_LABEL[info.type] +
      (info.type !== 'keep' ? ' &middot; tier ' + info.tier : '') + '. ' + TYPE_NOTE[info.type] + boss + '</p>';
  }

  function tap(id) {
    if (id == null) { selected = null; refresh(); return; }
    selected = id;
    if (canCapture(state, id)) state = capture(state, id);
    refresh();
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  function buildLegend() {
    const el = $('legend');
    el.innerHTML = '';
    for (const t of ['keep', 'garrison', 'mine', 'town', 'shrine', 'citadel']) {
      const d = document.createElement('div');
      const c = document.createElement('canvas');
      const dpr = Math.min(3, devicePixelRatio || 1);
      c.width = 28 * dpr; c.height = 28 * dpr;
      const x = c.getContext('2d'); x.scale(dpr, dpr);
      drawBadge(x, t, 14, 13, 11, palette, 'full');
      d.appendChild(c);
      d.appendChild(document.createTextNode(TYPE_LABEL[t]));
      el.appendChild(d);
    }
  }

  function repaint() {
    palette = mapPaletteFromCSS(document.documentElement);
    view.setPalette(palette);
    buildLegend();
  }

  // theme toggle: auto -> light -> dark
  const modes = ['auto', 'light', 'dark'];
  let mode = 0;
  try { const m = localStorage.getItem('cm-map-theme'); if (modes.includes(m)) mode = modes.indexOf(m); } catch (_) {}
  function applyTheme() {
    const m = modes[mode];
    if (m === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', m);
    $('theme').textContent = 'Theme: ' + m;
    try { localStorage.setItem('cm-map-theme', m); } catch (_) {}
    repaint();
  }
  $('theme').addEventListener('click', () => { mode = (mode + 1) % modes.length; applyTheme(); });
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', repaint); } catch (_) {}

  $('regen').addEventListener('click', generate);
  $('seed').addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
  $('region').addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
  $('dice').addEventListener('click', () => {
    const words = ['ember', 'gambit', 'rook', 'fianchetto', 'zugzwang', 'pawnstorm', 'outpost', 'tempo', 'castle', 'sicilian'];
    $('seed').value = words[Math.floor(Math.random() * words.length)] + '-' + Math.floor(Math.random() * 1000);
    generate();
  });
  $('reset').addEventListener('click', () => { state = initialMapState(region); selected = null; refresh(); });
  $('reveal').addEventListener('click', () => { state = { region, held: region.nodes.map(n => n.id) }; refresh(); });

  applyTheme();
  generate();
})();
</script>
