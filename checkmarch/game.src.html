* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px;
  -webkit-tap-highlight-color: transparent; overflow-x: hidden }
#app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px }
button { font: inherit; color: inherit; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); padding: 0 14px; cursor: pointer; touch-action: manipulation }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.num { font-variant-numeric: tabular-nums }

/* header: a heraldic crest, the house name, then region + the lord who holds it */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--hdr); border: 1px solid var(--line); border-radius: 14px; padding: 6px 8px 6px 10px; box-shadow: inset 0 0 0 2px var(--panel), inset 0 0 0 3px var(--line) }

.crest .cr-sh { fill: var(--crest-2) } .crest .cr-in { fill: var(--crest) } .crest .cr-k { fill: var(--crest-ink) }
.bt { min-width: 0; display: flex; flex-direction: column; line-height: 1.1 }
.bn { font-family: var(--display); font-size: 24px; font-weight: 700; letter-spacing: .01em; white-space: nowrap }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }

.stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap }
.stat.gold b { color: var(--gold) }

/* world map */
[hidden] { display: none !important }
.mapsec { display: flex; flex-direction: column; gap: 6px }
.mapbox { position: relative; border-radius: 14px; overflow: hidden; background: var(--map-paper); border: 1px solid var(--line); box-shadow: var(--shadow) }
canvas#map { display: block; width: 100%; cursor: pointer }
canvas#rivalMap { position: absolute; left: 0; top: 0; pointer-events: none }

.marcher { position: absolute; left: 0; top: 0; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-fg); font-family: var(--chess); font-size: 19px; line-height: 1; box-shadow: 0 2px 6px rgba(0,0,0,.3); pointer-events: none; will-change: transform }
.march { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted) }

.march .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px }
.march b { color: var(--fg); font-variant-numeric: tabular-nums }
.raidpin { position: absolute; left: 0; top: 0; padding: 2px 8px 2px 6px; border-radius: 99px; background: var(--panel); color: var(--danger); border: 1.5px solid var(--danger); font-size: 12px; font-weight: 700; line-height: 18px; white-space: nowrap; pointer-events: none; box-shadow: 0 1px 4px rgba(0,0,0,.25); font-variant-numeric: tabular-nums }
.raidpin.hot { background: var(--danger); color: var(--panel); animation: pulse 1s ease-in-out infinite }
.roadmeta .warn { color: var(--danger); font-weight: 650 }
.roadmeta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: 13px; color: var(--muted) }
.roadmeta b { color: var(--fg); font-weight: 600 }
.stat.pulse b { animation: coin .6s ease }
@keyframes coin { 30% { transform: translateY(-2px); filter: brightness(1.25) } }

/* stage */
.stage { display: flex; flex-direction: column; align-items: center; gap: 10px }
.foe { width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap }
.foe .nm { font-family: var(--display); font-size: 19px; font-weight: 700; text-wrap: balance }
.foe .nm em { font-style: normal; color: var(--danger) }
.foe .meta { font-size: 13px; color: var(--muted) }
.doc { display: inline-block; font-family: var(--body); font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 7px; border-radius: 99px; border: 1px solid currentColor; vertical-align: middle; color: var(--muted) }
.doc.aggressive { color: var(--danger) } .doc.solid { color: var(--accent) } .doc.greedy { color: var(--gold) }
.foe .why { width: 100%; font-size: 12.5px; color: var(--muted) }
.boardwrap { --bw: min(92vw, 420px, 100%); width: var(--bw); position: relative }
.board { container-type: inline-size; position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); touch-action: manipulation; user-select: none; -webkit-user-select: none }
.sqs { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr) }
.sq { position: relative; background: var(--sq-light) }
.sq.d { background: var(--sq-dark) }
.sq .co { position: absolute; font-size: 10px; font-weight: 650; line-height: 1; color: var(--coord-light); pointer-events: none }
.sq.d .co { color: var(--coord-dark) }
.sq .co.f { right: 3px; bottom: 2px } .sq .co.r { left: 3px; top: 3px }
.sq.last::before { content: ""; position: absolute; inset: 0; background: var(--hl) }
.sq.own::after { content: ""; position: absolute; inset: 3px; border-radius: 6px; box-shadow: inset 0 0 0 2px var(--own) }
.sq.buy::after { content: "+"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 300; color: var(--fg); opacity: .32 }
.sq.buy.pick::after { opacity: .9; color: var(--accent); }
.sq.sel::before { content: ""; position: absolute; inset: 0; background: var(--accent-soft); box-shadow: inset 0 0 0 3px var(--accent) }
.sq.cand::before { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 3px var(--gold); background: color-mix(in srgb, var(--gold) 18%, transparent) }
.sq.dot::after { content: ""; position: absolute; left: 50%; top: 50%; width: 26%; height: 26%; margin: -13% 0 0 -13%; border-radius: 50%; background: var(--accent); opacity: .55 }
.sq.dot.cap::after { width: 84%; height: 84%; margin: -42% 0 0 -42%; background: transparent; box-shadow: inset 0 0 0 4px var(--accent); opacity: .6 }
.sq.hint::before { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 3px var(--hint); background: var(--accent-soft) }
.sq.check::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, var(--danger) 0%, transparent 72%); animation: pulse 1s ease-in-out infinite }
@keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: .95 } }
.pcs { position: absolute; inset: 0; pointer-events: none }
.pc { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; display: grid; place-items: center; transition: transform .26s cubic-bezier(.3,.7,.3,1), opacity .25s; will-change: transform }
.pc .g { grid-area: 1/1; font-family: var(--chess); font-size: min(9vw, 40px); font-size: 10.4cqw; line-height: 1; font-variant-emoji: text }
.pc.w .fill { color: var(--p-fill) }
.pc.w .ink { color: var(--p-ink); filter: drop-shadow(0 2px 1.5px var(--piece-shadow)) }
.pc.b .g { color: var(--e-fill); text-shadow: 0 0 1.5px var(--e-halo), 0 0 1px var(--e-halo), 1px 0 0 var(--e-edge), -1px 0 0 var(--e-edge), 0 1px 0 var(--e-edge), 0 -1px 0 var(--e-edge); filter: drop-shadow(0 2px 1.5px var(--piece-shadow)) }
.pc.ghost { opacity: .5 }
.pc.ghost .g { text-shadow: 1px 0 0 var(--e-edge), -1px 0 0 var(--e-edge), 0 1px 0 var(--e-edge), 0 -1px 0 var(--e-edge) }
.pc.gone { opacity: 0; transform: var(--t) scale(.5) !important }
.pc.lift { z-index: 2 }
.pc.lift .g { transform: translateY(-4%) scale(1.08) }
.pc.pop .g { animation: pop .45s ease }
@keyframes pop { 40% { transform: scale(1.3) } }
.ov { z-index: 8; position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 38%, transparent); padding: 16px }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px; width: min(100%, 300px); max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; text-align: center }
.card h2 { margin: 0; font-family: var(--display); font-size: 26px; text-wrap: balance }
.card h2.bad { color: var(--danger) } .card h2.good { color: var(--accent) }
.card p { margin: 0; color: var(--muted); font-size: 14px }
.card ul { list-style: none; margin: 4px 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14px; text-align: left }
.card li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line); padding-bottom: 4px }
.card li b { font-variant-numeric: tabular-nums }
.card .choice { display: flex; flex-direction: column; gap: 8px; margin-top: 4px }
.card .choice button { min-height: 52px; display: flex; flex-direction: column; justify-content: center; gap: 1px; line-height: 1.2 }
.card .choice button small { font-weight: 400; font-size: 12.5px; opacity: .85 }
.status { min-height: 22px; font-size: 14px; color: var(--muted); text-align: center; text-wrap: balance }
.status b { color: var(--fg) } .status .warn { color: var(--danger); font-weight: 650 }
.controls { width: 100%; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center }
.controls button { flex: 1 1 0; min-width: 0; padding: 0 6px; font-size: 14px }
.controls button.wide { flex: 2 1 0 }
.tray { width: 100%; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 0 }
.tray:empty { display: none }
.tray .lbl { width: 100%; margin-top: 2px; text-align: center; font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase }
.chip { width: 48px; height: 48px; padding: 0; display: grid; place-items: center; font-family: var(--chess); font-size: 30px; border-radius: 10px; background: var(--sq-light); border: 2px solid transparent; position: relative }
.chip .g { grid-area: 1/1; line-height: 1 } .chip .fill { color: var(--p-fill) } .chip .ink { color: var(--p-ink) }
.chip.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.chip.gar { border-color: var(--accent); background: var(--accent-soft) }

        const tl = traitList(a.traits);

// terrain + enemy materials line for node and battle cards
function groundNote(t, a) {
  const g = terrainSummary(t), bits = [];

  const ms = (a && a.pieces || []).filter(p => p.m > 0);
  if (ms.length) bits.push(`<b>${ms.length}</b> forged enemy piece${ms.length > 1 ? 's' : ''} (${ms.map(p => MAT_NM[p.m] + ' ' + NAMES[p.t].toLowerCase()).join(', ')})`);
  return bits.join(' &middot; ');
}
function nodeEffect(n, held) {
  if (n.type === 'mine') return ` &middot; ${held ? 'pays' : 'held, it pays'} +${per100(mineRate(Math.max(1, n.tier)) * mineMult(run()) * goldMult(state.memories))} gold per 100 moves and digs <b>${RES_SHORT[mineResource(run(), n.id)] || '?'}</b> for the Forge`;
  if (n.type === 'town') return ` &middot; ${Math.round(TUNE.mapTownDiscount * 100)}% off the shop while you hold it or a place next to it`;
  if (n.type === 'shrine') { const d = (run().map.shrineDone || {})[n.id]; return held ? ` &middot; its one blessing is taken${d ? ': ' + esc(d) : ''}` : ' &middot; take it to choose one blessing (a lasting bonus)'; }
  if (n.type === 'citadel') return ' &middot; the rival\'s seat: take it to win the region';
  return '';
}

function copyText(text, box) {
  const fallback = () => { try { if (box) { box.focus(); box.select(); } return document.execCommand('copy'); } catch (e) { return false; } };
  const done = okk => toast(okk ? 'Save copied. Keep it somewhere safe.' : 'Select the text and copy it by hand.');
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(() => done(true), () => done(fallback())); return; } } catch (e) {}
  done(fallback());
}

      markSeen('bar'); sfx.promote(); toast(`${capFirst(res.newMaterial)} ${NAMES[pieceById(r, id).t].toLowerCase()}: tempered, now harder to capture.`);
      const sq = Object.keys(r.formation).find(q => r.formation[q] === id);
      if (sq != null && !battle) fxBoard.materialGlint(+sq, matTier(res.newMaterial));
      save(); if (!battle) renderBoard(false);
    } else toast(res.reason === 'max-tier' ? 'Already obsidian: it cannot be tempered further.' : `Needs a${/^no-(iron|obsidian)/.test(res.reason) ? 'n' : ''} ${res.reason.replace(/^no-|-bar$/g, '')} bar. Smelt one first.`);
    renderPanel(); return;
  }
  if (a.startsWith('runelo:')) { setRunElo(state, +a.slice(7)); save(); toast(`Opposition elo ${state.elo}: new foes from the next battle.`); renderFoe(); renderPanel(); return; }
  if (a.startsWith('pset:')) { if (choosePieceSet(state, a.slice(5))) { applyPieceSet(); save(); renderPanel(); } return; }
  if (a.startsWith('oret:')) { r.orders.retreat = a.slice(5); coachEv('order'); save(); renderPanel(); coachSync(); return; }
  // P1-5 banners: open the claim ritual, claim, or put it off
  if (a.startsWith('bannerask:')) { if (battle || ui.result) return; ui.ritual = a.slice(10); showResult(); return; }
  if (a.startsWith('bannerclaim:')) {
    const t = a.slice(12), res = claimBanner(state, t);
    if (!res.ok) { toast(res.reason === 'gold' ? `The banner needs ${P1.bannerGold} gold.` : 'That banner is not ready.'); return; }
    ui.ritual = null; $('ov').hidden = true; sfx.win();
    fxPage.regionWin({ title: `Banner of ${SK.SKILL_NAMES[t]}`, subtitle: res.trim ? 'Trimmed: two skills at 99' : 'Raised for every run to come', color: css('--gold') });
    toast(`The ${SK.SKILL_NAMES[t]} banner is raised: it flies on the Army tab, and your ${t === 'K' ? 'King carries' : NAMES[t].toLowerCase() + 's carry'} its pennant on the board.`);
    save(); renderAll(true); showResult(); return;
  }
  if (a === 'bannernot') { ui.ritual = null; $('ov').hidden = true; renderAll(false); showResult(); return; }
  if (a === 'rledger') { ui.rivalOpen = !ui.rivalOpen; renderRivalBar(); return; }
  if (a === 'endhall') { ui.endHall = !ui.endHall; renderEnd(); if (ui.endHall) try { $('endHall').scrollIntoView({ block: 'nearest' }); } catch (e) {} return; }
  if (a === 'threat') { state.settings.threat = !threatOn(); save(); renderPanel(); if (battle) renderBoard(false); return; }
  if (a.startsWith('theme:')) { const t = a.slice(6); if (THEME_NM[t]) { state.settings.theme = t; applyTheme(); save(); } renderPanel(); return; }
  if (a === 'tips') { if (coach) { coach.setEnabled(!coach.enabled()); save(); } renderPanel(); return; }
  if (a === 'tipsreplay') { if (coach) { coach.reset(); save(); toast('Tips will show again, one at a time, as you meet each part of the game.'); } renderPanel(); coachSync(); return; }
  if (a.startsWith('garr:')) {
    if (battle || r.map.raid.pending || rivalPending(r)) return;
    ui.node = +a.slice(5); ui.sel = null; ui.buySq = null; syncMap(); renderFoe(); renderBoard(true); renderControls();
    window.scrollTo({ top: 0, behavior: 'smooth' }); return;
  }
  switch (a) {
    case 'tact': if (buyTact(r)) { coachEv('buy'); sfx.buy(); toast(`Tactician level ${r.tact}`); save(); } renderLight(); break;
    case 'buysq': if (ui.buySq != null && buySquare(r, ui.buySq)) { coachEv('buy'); sfx.buy(); toast(`Square ${sqName(ui.buySq)} added to your formation`); ui.buySq = null; save(); } renderAll(true); break;
    case 'cancel': ui.buySq = null; ui.sel = null; renderBoard(false); renderControls(); break;
    case 'res': { const id = +el.dataset.id; ui.buySq = null; ui.sel = ui.sel && ui.sel.id === id && ui.sel.kind === 'res' ? null : { kind: 'res', id }; renderBoard(false); renderControls(); break; }
    case 'bench': if (ui.sel && ui.sel.kind === 'board') { unplace(r, ui.sel.sq); cleanGates(r); ui.sel = null; coachEv('formation-edit'); save(); sfx.move(); } renderBoard(true); renderControls(); renderPanel(); break;
    case 'march': if (ui.node != null) beginMarch(ui.node); break;
    case 'halt': cancelMarchUi(); break;
    case 'auto':
      ui.auto = !ui.auto; ui.rwResume = false; ui.sel = null; ui.hint = null; if (!ui.auto) coachEv('takeover');
      clearTimeout(ui.stepT); scheduleStep(ui.auto ? 250 : null); renderBoard(false); renderControls(); break;
    case 'hint': {
      if (!battle || battle.pos.side !== WHITE) break;
      coachEv('hint');
      const pay = payHint(r, battle);
      if (!pay.ok) { toast(`A hint costs ${pay.cost} gold.`); break; }
      if (!pay.free) renderTop();
      useTerrain(battle.terrain);
      const res = search(clonePos(battle.pos), Object.assign(battleEngineCfg(r, battle, WHITE), { history: battle.history, jitter: 0 }));
      ui.hint = res.move; ui.sel = { sq: mFrom(res.move) }; renderBoard(false); renderControls(); break;
    }
    case 'speed': state.settings.speed = state.settings.speed >= 4 ? 1 : state.settings.speed * 2; save(); renderControls(); break;
    case 'claim':
      if (battle && canClaim(battle) && !ui.traitT) { clearTimeout(ui.stepT); markSeen('claim'); decideBattle('Victory claimed'); }
      break;
    case 'retreat':
      if (ui.armed !== 'retreat') { ui.armed = 'retreat'; renderControls(); setTimeout(() => { if (ui.armed === 'retreat') { ui.armed = null; renderControls(); } }, 3500); break; }
      ui.armed = null; endBattle('loss', 'You sounded the retreat'); break;
    case 'cont': {
      if (ui.result && ui.result.nextRegion) tauntSoon(300);
      if (ui.result && ui.result.cache) markSeen('cache');
      ui.result = null; ui.lastBoard = null; $('ov').hidden = true;
      renderAll(true); showResult(); window.scrollTo({ top: 0 }); break;
    }
    case 'abdicate': {
      if (battle || r.cleared === 0) break;
      if (ui.armed !== 'abdicate') { ui.armed = 'abdicate'; renderPanel(); break; }
      const M = abdicateMemories(r), rs = r.sumTiers, runNo = state.totalRuns + 1; ui.armed = null; ui.endHall = false;
      const gain = endRun(state, M, freshSeed()); ensureMap(state.run); refreshCosmetics(state);
      ui.sel = null; ui.buySq = null; ui.node = null; ui.shrinePick = false;
      ui.ended = { kind: 'abdicate', runSum: rs, memories: gain, runNo };
      save(); sfx.win(); renderAll(false); window.scrollTo({ top: 0 }); break;
    }
    case 'oqueen': r.orders.keepQueen = !r.orders.keepQueen; coachEv('order'); save(); renderPanel(); break;
    case 'knight': knightPawn(+el.dataset.id); break;
    case 'shrinecancel': ui.shrinePick = false; renderAll(false); showResult(); break;
    case 'station': { const id = heldMineSel(); if (id != null && stationPiece(r, id, +el.dataset.id)) { coachEv('station'); sfx.move(); save(); } renderFoe(); renderBoard(true); renderControls(); renderPanel(); renderMapMeta(); break; }
    case 'recall': { const id = heldMineSel(); if (id != null && recallPiece(r, id, +el.dataset.id)) { sfx.move(); save(); } renderFoe(); renderBoard(true); renderControls(); renderPanel(); renderMapMeta(); break; }
    case 'garrdone': ui.node = null; syncMap(); renderFoe(); renderControls(); break;
    case 'elobegin': setRunElo(state, state.elo); save(); $('ov').hidden = true; renderAll(true); showResult(); toast(`Opposition: elo ${state.elo}. Good hunting.`); tauntSoon(2800); break;
    case 'bdefend': {
      const b = defendBorder(r); if (!b) break; markSeen('border');
      $('ov').hidden = true; startBattle(b); break;
    }
    case 'bconcede': {
      const p = rivalPending(r); if (!p) break;
      if (ui.armed !== 'bconcede') { ui.armed = 'bconcede'; showResult(); setTimeout(() => { if (ui.armed === 'bconcede') { ui.armed = null; if (!battle && !ui.result) showResult(); } }, 3500); break; }
      ui.armed = null;
      const name = region().nodes[p.nodeId].name, boss = rivalName(r), res = concedeBorder(state);
      if (!res) break; markSeen('border');
      if (res.runOver) { endRunUi('keep', res.memories, { boss }); break; }
      sfx.lose(); toast(`${name} is lost to ${boss}.`);
      $('ov').hidden = true; save(); syncMap(); renderAll(true); showResult(); break;
    }
    case 'defend': {
      const b = defendRaid(r); if (!b) break; markSeen('raid');
      $('ov').hidden = true; startBattle(b); break;
    }
    case 'concede': {
      const id = r.map.raid.pending && r.map.raid.pending.id;
      if (id == null || !concedeRaid(r)) break; markSeen('raid');
      sfx.lose(); toast(`${region().nodes[id].name} is lost to the raiders.`);
      $('ov').hidden = true; save(); syncMap(); renderAll(true); showResult(); break;
    }
    case 'newrun': ui.ended = null; ui.node = null; ui.sel = null; ui.buySq = null; save(); renderAll(false); showResult(); window.scrollTo({ top: 0 }); if (state.eloPicked) tauntSoon(400); break;
    case 'sound': toggleSound(); break;
    case 'reset': {
      if (ui.armed !== 'reset') { ui.armed = 'reset'; renderPanel(); break; }
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
      replaceSave(freshState(), null, 'Save erased. Fresh start.'); if (coach) coach.reset(); break;
    }
    case 'export': ui.expText = exportSaveText(snapshot()); renderPanel(); { const x = $('expBox'); if (x) { x.focus(); x.select(); } } break;
    case 'expcopy': copyText(ui.expText, $('expBox')); break;
    case 'import': {
      const p = parseSaveText(ui.impText);
      if (!p.ok) { ui.armed = null; ui.impErr = p.err; renderPanel(); break; }
      if (ui.armed !== 'import') { ui.armed = 'import'; ui.impErr = ''; ui.impSum = saveSummary(migrateState(JSON.parse(JSON.stringify(p.data.state)))); renderPanel(); break; }
      // confirmed: load it exactly as boot loads a stored save (migrate the state, then the battle by the save's version)
      const v0 = p.data.state.v | 0, st = migrateState(p.data.state); delete st.migratedFrom;
      let b = null; try { b = deserBattle(migrateBattleSave(p.data.battle, v0)); } catch (e) { b = null; }

  }
}
function toggleSound() {
  state.settings.sound = !state.settings.sound;
  audio.setEnabled(state.settings.sound);
  audio.setVolume({ master: state.settings.vol });
  if (state.settings.sound) { audio.unlock(); updateMood(); }
  save(); renderSoundBtn(); if (ui.tab === 'run') renderPanel();
}
function bindUi() {
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (b && !b.disabled) { act(b.dataset.act, b); return; }
    const tb = e.target.closest('[data-tab]'); if (tb) { ui.tab = tb.dataset.tab; ui.armed = null; coachEv('tab:' + ui.tab); renderPanel(); updateMood(); coachSync(); }
  });
  $('btnSound').addEventListener('click', toggleSound);
  $('btnGear').addEventListener('click', () => {
    if ($('panel').hidden) { toast('Settings open on the Run tab once your next run begins.'); return; }
    ui.tab = 'run'; ui.armed = null; coachEv('tab:run'); renderPanel(); updateMood(); coachSync();
    const h = $('setHead'); if (h) h.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  // settings inputs live in the panel (re-rendered as HTML), so they are delegated: the slider sets the master volume live
  $('panel').addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'setVol') { state.settings.vol = cleanSettings({ vol: t.value / 100 }).vol; audio.setVolume({ master: state.settings.vol }); const o = $('setVolOut'); if (o) o.textContent = Math.round(state.settings.vol * 100) + '%'; t.setAttribute('aria-valuetext', o ? o.textContent : ''); }
    else if (t.id === 'impBox') { ui.impText = t.value; if (ui.impErr) { ui.impErr = ''; const n = $('panel').querySelector('.note.bad'); if (n) n.remove(); } const b = $('panel').querySelector('[data-act="import"]'); if (b) b.disabled = !t.value.trim(); }
  });
  $('panel').addEventListener('change', e => { if (e.target.id === 'setVol') { save(); if (state.settings.sound) sfx.coin(); } });
  // the audio context may only start inside a user gesture; unlock() is idempotent and cheap
  document.addEventListener('pointerup', () => { if (audio.unlock()) { updateMood(); renderSoundBtn(); } });
  $('map').addEventListener('pointermove', placeRaidPin);
  // the rival bar is a button too (Enter / Space open the ledger)
  $('rivalBar').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act('rledger'); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { ui.sel = null; ui.buySq = null; ui.armed = null; if (!battle) { ui.node = null; syncMap(); renderFoe(); } renderBoard(false); renderControls(); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else if (!battle && run().map.march) marchFrame(); });
  window.addEventListener('pagehide', save);
}

// ---------- income tick ----------
let lastTick = Date.now();
function tick() {
  const now = Date.now(), dt = now - lastTick; lastTick = now;
  // world time passes ONLY from play (chess moves and march steps): this real-time tick is cosmetic (UI, autosave, self-heal)
  updateRivalEta();
  renderTop();
  updateMood();
  if (!battle && !ui.ended) { const t = $('raidTx'); if (t) t.outerHTML = raidMeta(); placeRaidPin(); const w = $('weekTx'); if (w && w.dataset.k !== String(run().ticks)) { w.dataset.k = String(run().ticks); renderMapMeta(); } }
  // mine income pop: a soft coin at most every 15 s, and only after play moved the world (mines pay per tick, never per second)
  if (run().mines.length && !battle && !document.hidden && now - (tick.coin || 0) > 15000 && run().ticks !== tick.coinT) {
    tick.coin = now; tick.coinT = run().ticks; sfx.coin();
    if (!$('mapSec').hidden) for (const id of heldMines(run())) fxAtNode('coin', id);
    const g = document.querySelector('.stat.gold'); g.classList.remove('pulse'); g.offsetWidth; g.classList.add('pulse');
  }
  if ((ui.tab === 'shop' || ui.tab === 'army') && !document.hidden) refreshShopButtons();
  if (ui.tab === 'forge' && !document.hidden && !ui.ended) { const k = JSON.stringify(run().forge.stock) + run().forge.lastTs + run().gold; if (k !== tick.fk) { tick.fk = k; renderPanel(); } }
  if (now - (tick.saved || 0) > 10000) { tick.saved = now; save(); }
  if (!battle && !ui.ended) { if (now - (ui.goalT || 0) > 8000) { ui.goalT = now; ui.goalI++; } renderGoal(); }
  drainNews(); coachSync();
  // self-heal: a gate (elo pick, border battle, raid, shrine) is active but its card is not showing
  if (!battle && !ui.result && !ui.ended && $('ov').hidden
    && (!state.eloPicked || rivalPending(run()) || run().map.raid.pending || (run().map.shrine != null && !ui.shrinePick) || DSC.discoveryBusy(run()) || fairyCeremonyNext(state))) showResult();
}
// n world ticks pass (a battle move or a march step; never wall time): income, raid clock, rival, weeks
function applyTicks(n) {
  const res = worldTick(state, n, true);
  if (res.dings && res.dings.length) queueDings(res.dings);  // mine-income skill XP (also mid-battle)
  if (res.raid && !battle && !ui.result && !ui.ended) onRaid();
  if (res.events.length) onRivalEvents(res.events);
  if (res.weeks && res.weeks.length) onWeeks(res.weeks);
  return res;
}
// P0-4: a week turned: one toast (the new week's event, muster and mine pulse), the first time with the explainer
function weekToast(w) {
  const e = w.ev ? WEEK_BY_ID[w.ev] : null, bits = [];
  bits.push(e ? `Week ${w.n}: the ${e.name} begins (${e.text}, for this week)` : `Week ${w.n} begins`);
  if (w.muster) bits.push(`the keep musters ${nOf(w.muster, 'militia pawn', 'militia pawns')}`);
  if (w.pulse >= 1) bits.push(`your mines pay +${fmt(w.pulse)} gold`);
  return bits.join('; ') + '.';
}
function onWeeks(ws) {
  const w = ws[ws.length - 1], x = markSeen('week');
  clearTimeout(ui.weekT);
  ui.weekT = setTimeout(() => toast(weekToast(w) + (x ? ' ' + x : '')), battle ? 0 : 200);
  // polish: a banner in the top strip as the week turns (clear of the board), toned by the week's event
  const e = w.ev ? WEEK_BY_ID[w.ev] : null;
  fxTop.regionWin({ title: e ? e.name : `Week ${w.n}`, subtitle: `Week ${w.n} begins: ${!e || e.tone === 'neutral' ? 'a quiet week' : e.tone === 'bad' ? 'a hard week' : 'a good week'}`, color: css(e && e.tone === 'bad' ? '--danger' : e && e.tone === 'good' ? '--gold' : '--accent') });
  if (!battle) renderMapMeta();
}
function refreshShopButtons() {
  // cheap re-enable of buy buttons as gold arrives
  const r = run();
  for (const b of $('panel').querySelectorAll('button[data-act]')) {
    const a = b.dataset.act; let cost = null;
    if (a.startsWith('buy:')) cost = pieceCost(r, a.slice(4)); else if (a.startsWith('fbuy:')) cost = fairyBlocker(r, a.slice(5)) ? null : fairyCost(r, a.slice(5)); else if (a === 'tact' && r.tact < TACT_MAX) cost = tactPrice(r.tact);
    else if (a.startsWith('dwell:')) { const t = a.slice(6), l = cleanDwell(r.dwell)[t]; cost = l < DWELL_MAX ? dwellPrice(t, l) : null; }
    if (cost == null) continue;
    const ok = r.gold >= effPrice(r, cost);
    if (b.disabled === ok) { b.disabled = !ok; b.classList.toggle('primary', ok); }
  }
  const bs = $('controls').querySelector('[data-act="buysq"]');
  if (bs) bs.disabled = r.gold < effPrice(r, squareCost(r));
}

// ---------- boot ----------
function boot(hotData) {
  const data = hotData && hotData.state ? hotData : loadSaved();
  let migrated = 0, dropped = false;
  const v0 = data && data.state ? data.state.v | 0 : 0; // the save's version keys the v5 -> v6 battle migration (piece codes)
  const st = data && data.state ? migrateState(data.state) : null;
  if (st) { state = st; migrated = st.migratedFrom || 0; delete st.migratedFrom; battle = deserBattle(migrateBattleSave(data.battle, v0)); }
  else { dropped = !!(data && data.state); state = freshState(); battle = null; }
  state.settings = cleanSettings(state.settings); // every settings field is optional (older saves load with the defaults)
  if (!state.seen || typeof state.seen !== 'object' || Array.isArray(state.seen)) state.seen = {};
  ensureMap(state.run);
  audio.setEnabled(!!state.settings.sound); audio.setVolume({ master: state.settings.vol });
  if (!hotData) {
    // time passes only from play: away time grants nothing, the world simply waits (no catch-up, no earnings)
    const away = Date.now() - (state.lastTs || Date.now());
    if (away > 60000 && !(state.seen && state.seen.away)) { state.seen.away = 1; setTimeout(() => toast('The realm held its breath while you were away: time here passes only as you play.'), 600); }
  }
  if (migrated === 5) setTimeout(() => toast('New: exotic pieces. Each region you reach can open a dwelling with a new kind of piece; see Pieces on the Army tab.'), 300);
  else if (migrated === 4) setTimeout(() => toast('New: the Forge tab (ores, bars, tempered pieces), rocks and water on the field, and shrines with new choices.'), 300);
  else if (migrated === 3) setTimeout(() => toast(`A rival lord, ${rivalName(state.run)}, now holds the east. Build dwellings on the Army tab.`), 300);
  else if (migrated === 1) setTimeout(() => toast(`The world map is open: your army enters region ${state.run.map.region}. Memories can now be spent on the Run tab.`), 300);
  else if (migrated === 2) setTimeout(() => toast(`Memories are now spent on upgrades: you have ${fmt(state.memories)} to spend on the Run tab.`), 300);
  else if (dropped) setTimeout(() => toast('That save could not be read, so a fresh run begins.'), 300);
  if (battle && battle.over) battle = null;

  refreshCosmetics(state);
  registerDingStings();
  buildBoard(); initFx(); bindUi(); initMap(); applyTheme(); renderAll(false); showResult();
  initCoach(); // the coach marks (tips) read and write state.tutorial, so they ride the save and the hot snapshot
  // test/debug handle (no behaviour): lets a headless check force FX moments and read the state. Only with ?debug=1
  // (or #debug=1) in the page URL: the shipped page exposes nothing (the harnesses load game.html?debug=1)
  let dbg = false; try { dbg = /[?&#]debug=1\b/.test(location.search + location.hash); } catch (e) {}

  if (battle) scheduleStep(600);
  setInterval(tick, 1000);
  save();
  try { window.claude && window.claude.hot && window.claude.hot.snapshot(() => { state && (state.lastTs = Date.now()); return snapshot(); }); } catch (e) {}
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? null);
})();
